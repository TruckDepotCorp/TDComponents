<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>

<div style="background:var(--uiux-color-surface);border:1px solid var(--uiux-color-border);border-radius:var(--uiux-radius-lg);box-shadow:var(--uiux-shadow-sm);padding:22px;display:flex;flex-direction:column;gap:20px"><div style="display:flex;flex-direction:column;gap:10px;min-width:0"><span style="font:700 11px var(--uiux-font-family);letter-spacing:calc(0.14em * var(--uiux-label-track));text-transform:var(--uiux-label-case);color:var(--uiux-color-text-muted)">Horizontal · clic en un paso completado para volver</span><ol style="display:flex;flex-wrap:wrap;margin:0;padding:0;list-style:none;gap:8px 0"><sc-for list="{{ nv.steps }}" as="st" hint-placeholder-count="4"><li style="flex:1 1 150px;display:flex;align-items:center;min-width:0"><button type="button" onClick="{{ st.onClick }}" disabled="{{ st.disabled }}" aria-current="{{ st.cur }}" style="display:flex;align-items:center;gap:10px;border:none;background:transparent;padding:4px;cursor:{{ st.cursor }};border-radius:6px;min-width:0;text-align:left;color:inherit" style-focus="outline:none;box-shadow:0 0 0 3px var(--uiux-color-focus-ring)"><span style="width:32px;height:32px;box-sizing:border-box;border-radius:50%;border:2px solid {{ st.ring }};background:{{ st.bg }};color:{{ st.fg }};font:700 13px var(--uiux-font-mono);display:flex;align-items:center;justify-content:center;flex:none">{{ st.mark }}</span><span style="display:flex;flex-direction:column;min-width:0"><span style="font:600 14px var(--uiux-font-family);color:{{ st.lc }};white-space:nowrap">{{ st.label }}</span><span style="font:500 12px var(--uiux-font-family);color:var(--uiux-color-text-muted);white-space:nowrap">{{ st.sub }}</span></span></button><sc-if value="{{ st.hasLine }}" hint-placeholder-val="{{ true }}"><span style="flex:1;height:2px;min-width:12px;background:{{ st.line }};margin:0 10px"></span></sc-if></li></sc-for></ol><div style="display:flex;flex-direction:column;gap:6px;padding:16px 18px;border-radius:var(--uiux-radius-md);background:var(--uiux-color-surface-secondary)"><span style="font:700 16px var(--uiux-font-family)">{{ nv.stepTitle }}</span><span style="font:400 14px/1.55 var(--uiux-font-family);color:var(--uiux-color-text-muted);text-wrap:pretty">{{ nv.stepText }}</span></div><div style="display:flex;gap:14px;flex-wrap:wrap;align-items:center"><sc-if value="{{ nv.stepOpen }}" hint-placeholder-val="{{ true }}"><button type="button" onClick="{{ nv.stepPrev }}" disabled="{{ nv.stepPrevDis }}" style="height:36px;padding:0 12px;border-radius:var(--uiux-radius-sm);border:1px solid var(--uiux-color-border-strong);background:transparent;color:var(--uiux-color-text);font:700 12px var(--uiux-font-family);letter-spacing:calc(0.08em * var(--uiux-label-track));text-transform:var(--uiux-label-case);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;flex:none;text-decoration:none;opacity:{{ nv.stepPrevOp }}" style-hover="background:var(--uiux-color-surface-secondary);text-decoration:none;color:var(--uiux-color-text)" style-active="transform:scale(.98)" style-focus="outline:none;box-shadow:0 0 0 3px var(--uiux-color-focus-ring)">Anterior</button><button type="button" onClick="{{ nv.stepNext }}" style="height:36px;padding:0 14px;border-radius:var(--uiux-radius-sm);border:none;background:var(--uiux-color-primary);color:#fff;font:700 12px var(--uiux-font-family);letter-spacing:calc(0.08em * var(--uiux-label-track));text-transform:var(--uiux-label-case);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;flex:none;text-decoration:none;" style-hover="background:var(--uiux-color-primary-hover);text-decoration:none;color:#fff" style-active="transform:scale(.98)" style-focus="outline:none;box-shadow:0 0 0 3px var(--uiux-color-focus-ring)">{{ nv.stepNextLabel }}</button></sc-if><sc-if value="{{ nv.stepDone }}" hint-placeholder-val="{{ false }}"><button type="button" onClick="{{ nv.stepReset }}" style="height:36px;padding:0 12px;border-radius:var(--uiux-radius-sm);border:1px solid var(--uiux-color-border-strong);background:transparent;color:var(--uiux-color-text);font:700 12px var(--uiux-font-family);letter-spacing:calc(0.08em * var(--uiux-label-track));text-transform:var(--uiux-label-case);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;flex:none;text-decoration:none;" style-hover="background:var(--uiux-color-surface-secondary);text-decoration:none;color:var(--uiux-color-text)" style-active="transform:scale(.98)" style-focus="outline:none;box-shadow:0 0 0 3px var(--uiux-color-focus-ring)">Reiniciar</button></sc-if></div></div><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:22px 20px;align-items:start"><div style="display:flex;flex-direction:column;gap:10px;min-width:0"><span style="font:700 11px var(--uiux-font-family);letter-spacing:calc(0.14em * var(--uiux-label-track));text-transform:var(--uiux-label-case);color:var(--uiux-color-text-muted)">Vertical · seguimiento del pedido</span><ol style="margin:0;padding:0;list-style:none;display:flex;flex-direction:column"><sc-for list="{{ nv.vsteps }}" as="vs" hint-placeholder-count="4"><li style="display:flex;gap:14px"><div style="display:flex;flex-direction:column;align-items:center"><span style="width:22px;height:22px;box-sizing:border-box;border-radius:50%;border:2px solid {{ vs.ring }};background:{{ vs.bg }};color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:{{ vs.halo }};flex:none">{{ vs.mark }}</span><sc-if value="{{ vs.hasLine }}" hint-placeholder-val="{{ true }}"><span style="width:2px;flex:1;min-height:26px;background:{{ vs.lineBg }};margin:4px 0"></span></sc-if></div><div style="display:flex;flex-direction:column;gap:2px;padding-bottom:16px"><span style="font:600 14.5px var(--uiux-font-family);color:{{ vs.lc }}">{{ vs.label }}</span><span style="font:500 11.5px var(--uiux-font-mono);color:var(--uiux-color-text-muted)">{{ vs.time }}</span><span style="font:400 13px/1.45 var(--uiux-font-family);color:var(--uiux-color-text-muted)">{{ vs.desc }}</span></div></li></sc-for></ol><div style="display:flex;gap:14px;flex-wrap:wrap;align-items:center"><button type="button" onClick="{{ nv.vAdvance }}" disabled="{{ nv.vDone }}" style="height:36px;padding:0 14px;border-radius:var(--uiux-radius-sm);border:none;background:var(--uiux-color-primary);color:#fff;font:700 12px var(--uiux-font-family);letter-spacing:calc(0.08em * var(--uiux-label-track));text-transform:var(--uiux-label-case);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;flex:none;text-decoration:none;height:34px;opacity:{{ nv.vOp }}" style-hover="background:var(--uiux-color-primary-hover);text-decoration:none;color:#fff" style-active="transform:scale(.98)" style-focus="outline:none;box-shadow:0 0 0 3px var(--uiux-color-focus-ring)">Avanzar estado</button><button type="button" onClick="{{ nv.vReset }}" style="height:36px;padding:0 12px;border-radius:var(--uiux-radius-sm);border:1px solid var(--uiux-color-border-strong);background:transparent;color:var(--uiux-color-text);font:700 12px var(--uiux-font-family);letter-spacing:calc(0.08em * var(--uiux-label-track));text-transform:var(--uiux-label-case);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;flex:none;text-decoration:none;height:34px" style-hover="background:var(--uiux-color-surface-secondary);text-decoration:none;color:var(--uiux-color-text)" style-active="transform:scale(.98)" style-focus="outline:none;box-shadow:0 0 0 3px var(--uiux-color-focus-ring)">Reiniciar</button></div></div><div style="display:flex;flex-direction:column;gap:10px;min-width:0"><span style="font:700 11px var(--uiux-font-family);letter-spacing:calc(0.14em * var(--uiux-label-track));text-transform:var(--uiux-label-case);color:var(--uiux-color-text-muted)">Compacto</span><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:4px"><sc-for list="{{ nv.stepBars }}" as="b" hint-placeholder-count="4"><span style="height:6px;border-radius:999px;background:{{ b }}"></span></sc-for></div><span style="font:600 14px var(--uiux-font-family)">{{ nv.stepCount }}</span><span style="font:500 13px var(--uiux-font-family);color:var(--uiux-color-text-muted)">Sincronizado con el ejemplo horizontal.</span></div></div></div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{}">
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
