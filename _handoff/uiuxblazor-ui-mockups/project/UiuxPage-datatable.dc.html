<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>

<div style="display:flex;flex-direction:column;gap:14px">
<div ref="{{ tRef }}" style="position:relative;background:var(--uiux-color-surface);border:1px solid var(--uiux-color-border);border-radius:var(--uiux-radius-lg);box-shadow:var(--uiux-shadow-sm)">
<div style="padding:12px 14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--uiux-color-border)">
<span style="width:34px;height:34px;border-radius:var(--uiux-radius-sm);background:var(--uiux-color-surface-secondary);border:1px solid var(--uiux-color-border);display:flex;align-items:center;justify-content:center;color:var(--uiux-color-primary)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"></ellipse><path d="M3 5v14a9 3 0 0 0 18 0V5"></path><path d="M3 12a9 3 0 0 0 18 0"></path></svg></span>
<div style="display:flex;flex-direction:column;gap:2px"><span style="font:600 13.5px var(--uiux-font-mono)">dbo.sp_InventarioPorBodega</span><span style="font-size:12.5px;color:var(--uiux-color-text-muted)">{{ tSourceMeta }}</span></div>
<div style="flex:1"></div>
<button onClick="{{ tSchemaToggle }}" aria-expanded="{{ tSchemaAria }}" style="height:34px;padding:0 12px;border-radius:var(--uiux-radius-sm);border:1px solid var(--uiux-color-border-strong);background:transparent;color:var(--uiux-color-text);font:700 12px var(--uiux-font-family);letter-spacing:calc(0.08em * var(--uiux-label-track));text-transform:var(--uiux-label-case);cursor:pointer;display:inline-flex;align-items:center;gap:8px" style-hover="background:var(--uiux-color-surface-secondary)" style-focus="outline:none;box-shadow:0 0 0 3px var(--uiux-color-focus-ring)">{{ tSchemaLabel }}</button>
<div style="position:relative"><button onClick="{{ tColsToggle }}" aria-haspopup="true" aria-expanded="{{ tColsAria }}" style="height:34px;padding:0 12px;border-radius:var(--uiux-radius-sm);border:1px solid var(--uiux-color-border-strong);background:transparent;color:var(--uiux-color-text);font:700 12px var(--uiux-font-family);letter-spacing:calc(0.08em * var(--uiux-label-track));text-transform:var(--uiux-label-case);cursor:pointer;display:inline-flex;align-items:center;gap:8px" style-hover="background:var(--uiux-color-surface-secondary)" style-focus="outline:none;box-shadow:0 0 0 3px var(--uiux-color-focus-ring)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2"></rect><path d="M9 3v18M15 3v18"></path></svg>{{ tVisLabel }}<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"></path></svg></button>
<sc-if value="{{ tColsOpen }}" hint-placeholder-val="{{ false }}"><div onMouseDown="{{ tColsClose }}" style="position:fixed;inset:0;z-index:35"></div><div role="menu" style="position:absolute;right:0;top:40px;z-index:40;width:230px;max-height:320px;overflow-y:auto;padding:6px;background:var(--uiux-color-surface);border:1px solid var(--uiux-color-border);border-radius:var(--uiux-radius-md);box-shadow:var(--uiux-shadow-lg);display:flex;flex-direction:column;gap:1px">
<button role="menuitemcheckbox" aria-checked="{{ tAll.aria }}" onClick="{{ tAll.onToggle }}" style="display:flex;align-items:center;gap:10px;padding:7px 10px;border:none;border-bottom:1px solid var(--uiux-color-border);border-radius:0;background:transparent;color:var(--uiux-color-text);font:600 14px var(--uiux-font-family);text-align:left;cursor:pointer;margin-bottom:4px" style-hover="background:var(--uiux-color-surface-secondary)"><span style="width:16px;height:16px;border-radius:3px;border:1.5px solid {{ tAll.boxBorder }};background:{{ tAll.boxBg }};display:flex;align-items:center;justify-content:center;color:#fff;flex:none"><sc-if value="{{ tAll.on }}" hint-placeholder-val="{{ true }}"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"></path></svg></sc-if><sc-if value="{{ tAll.some }}" hint-placeholder-val="{{ false }}"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"></path></svg></sc-if></span>Todas</button>
<sc-for list="{{ tColList }}" as="tc" hint-placeholder-count="11"><button role="menuitemcheckbox" aria-checked="{{ tc.aria }}" onClick="{{ tc.onToggle }}" style="display:flex;align-items:center;gap:10px;padding:7px 10px;border:none;border-radius:5px;background:transparent;color:var(--uiux-color-text);font:500 14px var(--uiux-font-family);text-align:left;cursor:pointer" style-hover="background:var(--uiux-color-surface-secondary)"><span style="width:16px;height:16px;border-radius:3px;border:1.5px solid {{ tc.boxBorder }};background:{{ tc.boxBg }};display:flex;align-items:center;justify-content:center;color:#fff;flex:none"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" style="opacity:{{ tc.op }}"><path d="M20 6 9 17l-5-5"></path></svg></span><span style="flex:1">{{ tc.label }}</span><span style="font:500 11px var(--uiux-font-mono);color:var(--uiux-color-text-muted)">{{ tc.type }}</span></button></sc-for></div></sc-if></div>
</div>
<sc-if value="{{ tSchema }}" hint-placeholder-val="{{ false }}"><div style="padding:12px 14px;border-bottom:1px solid var(--uiux-color-border);background:var(--uiux-color-surface-secondary);display:flex;flex-direction:column;gap:8px"><span style="font:700 11px var(--uiux-font-family);letter-spacing:calc(0.14em * var(--uiux-label-track));text-transform:var(--uiux-label-case);color:var(--uiux-color-text-muted)">Esquema · DataTable.Columns</span><div style="display:flex;flex-wrap:wrap;gap:6px"><sc-for list="{{ tSchemaCols }}" as="sc" hint-placeholder-count="11"><span style="display:inline-flex;align-items:center;gap:8px;height:28px;padding:0 10px;border-radius:var(--uiux-radius-sm);background:var(--uiux-color-surface);border:1px solid var(--uiux-color-border);font:500 12.5px var(--uiux-font-mono)">{{ sc.name }}<span style="color:var(--uiux-color-primary)">{{ sc.type }}</span><span style="color:var(--uiux-color-text-muted)">{{ sc.nullable }}</span></span></sc-for></div></div></sc-if>
<div style="overflow-x:auto">
<table style="width:100%;border-collapse:collapse;font-size:14px;text-align:left">
<thead>
<tr><sc-for list="{{ tHeads }}" as="h" hint-placeholder-count="11"><th aria-sort="{{ h.ariaSort }}" style="padding:0 12px;height:40px;background:var(--uiux-color-surface-secondary);font:700 11px var(--uiux-font-family);letter-spacing:calc(0.12em * var(--uiux-label-track));text-transform:var(--uiux-label-case);color:var(--uiux-color-text-muted);white-space:nowrap;text-align:{{ h.align }}"><button onClick="{{ h.onSort }}" style="display:flex;align-items:center;gap:6px;padding:4px 0;border:none;background:transparent;color:{{ h.labelColor }};font:700 11px var(--uiux-font-family);letter-spacing:calc(0.12em * var(--uiux-label-track));text-transform:var(--uiux-label-case);cursor:pointer;white-space:nowrap;margin-left:{{ h.ml }}" style-hover="color:var(--uiux-color-text)" style-focus="outline:none;box-shadow:0 0 0 3px var(--uiux-color-focus-ring)">{{ h.label }}<span style="display:flex;color:{{ h.sortColor }};opacity:{{ h.sortOp }}"><sc-if value="{{ h.sAsc }}" hint-placeholder-val="{{ false }}"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 7-7 7 7M12 19V5"></path></svg></sc-if><sc-if value="{{ h.sDesc }}" hint-placeholder-val="{{ false }}"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M19 12l-7 7-7-7"></path></svg></sc-if><sc-if value="{{ h.sNone }}" hint-placeholder-val="{{ true }}"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21 16-4 4-4-4M17 20V4M3 8l4-4 4 4M7 4v16"></path></svg></sc-if></span></button></th></sc-for></tr>
<tr><sc-for list="{{ tHeads }}" as="h" hint-placeholder-count="11"><th style="padding:6px 8px;background:var(--uiux-color-surface-secondary);border-bottom:1px solid var(--uiux-color-border);font-weight:400"><div style="display:flex;align-items:center;min-width:{{ h.minW }};height:32px;border:1px solid {{ h.fBorder }};border-radius:var(--uiux-radius-sm);background:var(--uiux-color-surface);overflow:hidden">
<button onClick="{{ h.onOpMenu }}" aria-label="Operador de filtro {{ h.label }}" aria-haspopup="menu" title="{{ h.opTitle }}" style="flex:none;min-width:34px;height:100%;padding:0 6px;border:none;border-right:1px solid var(--uiux-color-border);background:{{ h.opBg }};color:{{ h.opFg }};font:600 11.5px var(--uiux-font-mono);cursor:pointer;white-space:nowrap" style-focus="outline:none;box-shadow:0 0 0 3px var(--uiux-color-focus-ring)">{{ h.opSym }}</button>
<input type="{{ h.inType }}" value="{{ h.fVal }}" onChange="{{ h.onFVal }}" disabled="{{ h.fDisabled }}" aria-label="Filtrar {{ h.label }}" placeholder="{{ h.fPh }}" style="flex:1;min-width:0;height:100%;padding:0 8px;border:none;background:transparent;color:var(--uiux-color-text);font:500 13px var(--uiux-font-family);outline:none">
</div></th></sc-for></tr>
</thead>
<tbody>
<sc-for list="{{ tRows }}" as="row" hint-placeholder-count="5"><tr style="background:{{ row.bg }}"><sc-for list="{{ row.cells }}" as="c" hint-placeholder-count="11"><td style="padding:10px 12px;border-bottom:1px solid var(--uiux-color-border);white-space:nowrap;text-align:{{ c.align }};font:{{ c.font }};color:{{ c.color }};font-style:{{ c.fs }}">{{ c.v }}</td></sc-for></tr></sc-for>
</tbody></table>
<sc-if value="{{ tEmpty }}" hint-placeholder-val="{{ false }}"><div style="padding:40px 16px;display:flex;flex-direction:column;gap:10px;align-items:center;text-align:center"><span style="font:600 15px var(--uiux-font-family)">Ninguna fila cumple los filtros</span><button onClick="{{ tClear }}" style="height:34px;padding:0 12px;border-radius:var(--uiux-radius-sm);border:1px solid var(--uiux-color-border-strong);background:transparent;color:var(--uiux-color-text);font:700 12px var(--uiux-font-family);letter-spacing:calc(0.08em * var(--uiux-label-track));text-transform:var(--uiux-label-case);cursor:pointer;display:inline-flex;align-items:center;gap:8px" style-hover="background:var(--uiux-color-surface-secondary)" style-focus="outline:none;box-shadow:0 0 0 3px var(--uiux-color-focus-ring)">Limpiar filtros</button></div></sc-if>
</div>
<div style="padding:10px 14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap">
<div style="display:flex;align-items:center;gap:4px">
<button onClick="{{ tPrev }}" disabled="{{ tIsFirst }}" aria-label="Página anterior" style="width:32px;height:32px;border-radius:var(--uiux-radius-sm);border:1px solid var(--uiux-color-border);background:transparent;color:var(--uiux-color-text);cursor:pointer;display:flex;align-items:center;justify-content:center;opacity:{{ tPrevOp }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"></path></svg></button>
<sc-for list="{{ tPages }}" as="p" hint-placeholder-count="3"><button onClick="{{ p.onPick }}" aria-current="{{ p.current }}" style="min-width:32px;height:32px;padding:0 6px;border-radius:var(--uiux-radius-sm);border:1px solid {{ p.border }};background:{{ p.bg }};color:{{ p.fg }};font:600 13px var(--uiux-font-mono);cursor:pointer" style-focus="outline:none;box-shadow:0 0 0 3px var(--uiux-color-focus-ring)">{{ p.label }}</button></sc-for>
<button onClick="{{ tNext }}" disabled="{{ tIsLast }}" aria-label="Página siguiente" style="width:32px;height:32px;border-radius:var(--uiux-radius-sm);border:1px solid var(--uiux-color-border);background:transparent;color:var(--uiux-color-text);cursor:pointer;display:flex;align-items:center;justify-content:center;opacity:{{ tNextOp }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"></path></svg></button></div>
<span style="font:500 13px var(--uiux-font-family);color:var(--uiux-color-text-muted)">{{ tPageInfo }}</span>
<div style="flex:1"></div>
<sc-if value="{{ tHasFilters }}" hint-placeholder-val="{{ false }}"><button onClick="{{ tClear }}" style="border:none;background:transparent;color:var(--uiux-color-primary);font:700 12px var(--uiux-font-family);letter-spacing:calc(0.08em * var(--uiux-label-track));text-transform:var(--uiux-label-case);cursor:pointer">Limpiar filtros</button></sc-if>
</div>
<sc-if value="{{ tMenuOpen }}" hint-placeholder-val="{{ false }}"><div onMouseDown="{{ tMenuClose }}" style="position:fixed;inset:0;z-index:35"></div>
<div role="menu" style="position:absolute;left:{{ tMenuL }};top:{{ tMenuT }};z-index:40;width:210px;padding:6px;background:var(--uiux-color-surface);border:1px solid var(--uiux-color-border);border-radius:var(--uiux-radius-md);box-shadow:var(--uiux-shadow-lg);display:flex;flex-direction:column;gap:1px">
<sc-for list="{{ tMenuOps }}" as="o" hint-placeholder-count="8"><button role="menuitemradio" aria-checked="{{ o.aria }}" onClick="{{ o.onPick }}" style="display:flex;align-items:center;gap:10px;padding:7px 10px;border:none;border-radius:5px;background:{{ o.bg }};color:var(--uiux-color-text);font:500 14px var(--uiux-font-family);text-align:left;cursor:pointer" style-hover="background:var(--uiux-color-surface-secondary)"><span style="width:34px;font:600 12px var(--uiux-font-mono);color:var(--uiux-color-primary)">{{ o.sym }}</span>{{ o.label }}</button></sc-for>
<button onClick="{{ tMenuClear }}" style="margin-top:4px;padding:8px 10px;border:none;border-top:1px solid var(--uiux-color-border);border-radius:0;background:transparent;color:var(--uiux-color-danger);font:600 14px var(--uiux-font-family);text-align:left;cursor:pointer">Limpiar filtro</button>
</div></sc-if>
</div>
<div style="background:#0A0B0C;color:#DCDFE3;border-radius:var(--uiux-radius-md);padding:14px 18px;display:flex;flex-direction:column;gap:8px">
<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap"><span style="font:700 11px var(--uiux-font-family);letter-spacing:.14em;text-transform:uppercase;color:#F78B85">DataView · en memoria</span><span style="flex:1"></span><span style="font:500 11.5px var(--uiux-font-mono);color:#9CA3AB">{{ tViewMeta }}</span></div>
<pre style="margin:0;font:400 12.5px/1.65 var(--uiux-font-mono);overflow-x:auto;white-space:pre">{{ tViewCode }}</pre></div>
<span style="font-size:13.5px;color:var(--uiux-color-text-muted)">Relacionado: <a href="#/grid">DataGrid con IQueryable</a> para datos tipados con EF Core.</span>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{}">
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
