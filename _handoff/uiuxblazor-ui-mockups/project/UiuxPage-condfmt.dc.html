<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>

<div style="display:flex;flex-direction:column;gap:14px">
<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px"><sc-for list="{{ cf.rules }}" as="ru" hint-placeholder-count="4"><button role="switch" aria-checked="{{ ru.aria }}" onClick="{{ ru.onToggle }}" style="display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--uiux-color-border);border-radius:var(--uiux-radius-md);background:var(--uiux-color-surface);color:var(--uiux-color-text);text-align:left;cursor:pointer" style-focus="outline:none;box-shadow:0 0 0 3px var(--uiux-color-focus-ring)"><span style="width:36px;height:20px;border-radius:999px;background:{{ ru.bg }};position:relative;flex:none"><span style="position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:#fff;transform:{{ ru.tf }};transition:transform 120ms"></span></span><span style="display:flex;flex-direction:column;gap:2px;flex:1"><span style="font:600 13.5px var(--uiux-font-family)">{{ ru.label }}</span><span style="font:500 11.5px var(--uiux-font-mono);color:var(--uiux-color-text-muted)">{{ ru.rule }}</span></span><span style="width:14px;height:14px;border-radius:3px;background:{{ ru.swatch }};border:1px solid var(--uiux-color-border);flex:none"></span></button></sc-for></div>
<div style="background:var(--uiux-color-surface);border:1px solid var(--uiux-color-border);border-radius:var(--uiux-radius-lg);box-shadow:var(--uiux-shadow-sm);overflow:hidden"><div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:14px;text-align:left"><thead><tr><th style="padding:0 12px;height:40px;background:var(--uiux-color-surface-secondary);border-bottom:1px solid var(--uiux-color-border);font:700 11px var(--uiux-font-family);letter-spacing:calc(0.12em * var(--uiux-label-track));text-transform:var(--uiux-label-case);color:var(--uiux-color-text-muted);white-space:nowrap">Código</th><th style="padding:0 12px;height:40px;background:var(--uiux-color-surface-secondary);border-bottom:1px solid var(--uiux-color-border);font:700 11px var(--uiux-font-family);letter-spacing:calc(0.12em * var(--uiux-label-track));text-transform:var(--uiux-label-case);color:var(--uiux-color-text-muted);white-space:nowrap">Repuesto</th><th style="padding:0 12px;height:40px;background:var(--uiux-color-surface-secondary);border-bottom:1px solid var(--uiux-color-border);font:700 11px var(--uiux-font-family);letter-spacing:calc(0.12em * var(--uiux-label-track));text-transform:var(--uiux-label-case);color:var(--uiux-color-text-muted);white-space:nowrap">Categoría</th><th style="padding:0 12px;height:40px;background:var(--uiux-color-surface-secondary);border-bottom:1px solid var(--uiux-color-border);font:700 11px var(--uiux-font-family);letter-spacing:calc(0.12em * var(--uiux-label-track));text-transform:var(--uiux-label-case);color:var(--uiux-color-text-muted);white-space:nowrap;text-align:right">Stock</th><th style="padding:0 12px;height:40px;background:var(--uiux-color-surface-secondary);border-bottom:1px solid var(--uiux-color-border);font:700 11px var(--uiux-font-family);letter-spacing:calc(0.12em * var(--uiux-label-track));text-transform:var(--uiux-label-case);color:var(--uiux-color-text-muted);white-space:nowrap;text-align:right">Precio</th><th style="padding:0 12px;height:40px;background:var(--uiux-color-surface-secondary);border-bottom:1px solid var(--uiux-color-border);font:700 11px var(--uiux-font-family);letter-spacing:calc(0.12em * var(--uiux-label-track));text-transform:var(--uiux-label-case);color:var(--uiux-color-text-muted);white-space:nowrap">Actualizado</th></tr></thead>
<tbody><sc-for list="{{ cf.rows }}" as="row" hint-placeholder-count="10"><tr style="background:{{ row.bg }};box-shadow:{{ row.bar }};opacity:{{ row.op }}">
<td style="padding:8px 12px;border-bottom:1px solid var(--uiux-color-border);white-space:nowrap;vertical-align:top;padding:10px 12px;font:500 12.5px var(--uiux-font-mono);color:var(--uiux-color-text-muted)">{{ row.code }}</td>
<td style="padding:8px 12px;border-bottom:1px solid var(--uiux-color-border);white-space:nowrap;vertical-align:top;padding:10px 12px"><span style="display:inline-flex;align-items:center;gap:8px;font-weight:{{ row.nameW }}">{{ row.name }}<sc-if value="{{ row.premium }}" hint-placeholder-val="{{ false }}"><span style="height:20px;padding:0 7px;border-radius:3px;background:var(--uiux-color-text);color:var(--uiux-color-surface);font:700 10px var(--uiux-font-family);letter-spacing:calc(0.12em * var(--uiux-label-track));text-transform:var(--uiux-label-case);display:inline-flex;align-items:center">Premium</span></sc-if></span></td>
<td style="padding:8px 12px;border-bottom:1px solid var(--uiux-color-border);white-space:nowrap;vertical-align:top;padding:10px 12px"><span style="display:inline-block;padding:3px 9px;border-radius:999px;border:1px solid var(--uiux-color-border);font:600 12px var(--uiux-font-family)">{{ row.cat }}</span></td>
<td style="padding:8px 12px;border-bottom:1px solid var(--uiux-color-border);white-space:nowrap;vertical-align:top;padding:6px 12px;text-align:right"><span style="display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 9px;border-radius:var(--uiux-radius-sm);background:{{ row.stBg }};color:{{ row.stColor }};font:600 13px var(--uiux-font-mono)">{{ row.stock }}</span></td>
<td style="padding:8px 12px;border-bottom:1px solid var(--uiux-color-border);white-space:nowrap;vertical-align:top;padding:10px 12px;text-align:right;font:var(--uiux-display-style) var(--uiux-display-weight, 800) 16px var(--uiux-font-display)">{{ row.price }}</td>
<td style="padding:8px 12px;border-bottom:1px solid var(--uiux-color-border);white-space:nowrap;vertical-align:top;padding:10px 12px;font:500 12.5px var(--uiux-font-mono);color:{{ row.updColor }}">{{ row.updated }}</td></tr></sc-for></tbody></table></div><div style="padding:10px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;border-top:1px solid var(--uiux-color-border);background:var(--uiux-color-surface-secondary)"><span style="flex:1;min-width:200px;font:500 13px var(--uiux-font-family);color:{{ cf.msgColor }}">{{ cf.msg }}</span></div></div></div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{}">
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
