<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>

<div style="background:var(--uiux-color-surface);border:1px solid var(--uiux-color-border);border-radius:var(--uiux-radius-lg);box-shadow:var(--uiux-shadow-sm);padding:22px;display:flex;flex-direction:column;gap:20px"><div style="display:flex;flex-direction:column;gap:24px"><sc-for list="{{ he.eds }}" as="e" hint-placeholder-count="2"><div style="display:flex;flex-direction:column;gap:8px"><span style="font:700 11px var(--uiux-font-family);letter-spacing:calc(0.14em * var(--uiux-label-track));text-transform:var(--uiux-label-case);color:var(--uiux-color-text-muted)">{{ e.title }}</span>
<div style="border:1px solid {{ e.border }};border-radius:var(--uiux-radius-md);background:var(--uiux-color-surface);box-shadow:{{ e.ring }};overflow:hidden;transition:border-color 120ms,box-shadow 120ms">
<div role="toolbar" aria-label="Formato" style="display:flex;flex-wrap:wrap;align-items:center;gap:2px;padding:6px;border-bottom:1px solid var(--uiux-color-border);background:var(--uiux-color-surface-secondary)"><sc-if value="{{ e.hasBlock }}" hint-placeholder-val="{{ false }}"><select value="{{ e.block }}" onChange="{{ e.onBlock }}" disabled="{{ e.src }}" aria-label="Estilo de párrafo" style="height:30px;padding:0 6px;margin-right:4px;border:1px solid var(--uiux-color-border-strong);border-radius:4px;background:var(--uiux-color-surface);color:var(--uiux-color-text);font:600 13px var(--uiux-font-family);outline:none;cursor:pointer"><option value="p">Párrafo</option><option value="h2">Título</option><option value="h3">Subtítulo</option><option value="blockquote">Cita</option></select></sc-if>
<sc-for list="{{ e.tools }}" as="t" hint-placeholder-count="8"><sc-if value="{{ t.sep }}" hint-placeholder-val="{{ false }}"><span style="width:1px;height:20px;background:var(--uiux-color-border-strong);margin:0 5px"></span></sc-if><sc-if value="{{ t.btn }}" hint-placeholder-val="{{ true }}"><button type="button" onMouseDown="{{ t.onDown }}" onClick="{{ t.onClick }}" aria-label="{{ t.label }}" title="{{ t.label }}" aria-pressed="{{ t.aria }}" disabled="{{ t.disabled }}" style="min-width:30px;height:30px;padding:0 6px;border:none;border-radius:4px;background:{{ t.bg }};color:{{ t.fg }};opacity:{{ t.dim }};cursor:pointer;display:flex;align-items:center;justify-content:center;gap:4px" style-hover="background:var(--uiux-color-border)" style-focus="outline:none;box-shadow:0 0 0 3px var(--uiux-color-focus-ring)"><span style="display:flex">{{ t.icon }}</span><span style="font:{{ t.gFont }};text-decoration:{{ t.gDeco }}">{{ t.glyph }}</span></button></sc-if><sc-if value="{{ t.sw }}" hint-placeholder-val="{{ false }}"><button type="button" onMouseDown="{{ t.onDown }}" onClick="{{ t.onClick }}" aria-label="{{ t.label }}" title="{{ t.label }}" style="width:18px;height:18px;margin:0 2px;box-sizing:border-box;border-radius:50%;border:2px solid {{ t.ring }};background:{{ t.hex }};cursor:pointer;padding:0" style-focus="outline:none;box-shadow:0 0 0 3px var(--uiux-color-focus-ring)"></button></sc-if></sc-for></div>
<sc-if value="{{ e.linkOpen }}" hint-placeholder-val="{{ false }}"><div style="display:flex;gap:8px;align-items:center;padding:8px;border-bottom:1px solid var(--uiux-color-border);flex-wrap:wrap"><input autoFocus="{{ true }}" value="{{ e.linkQ }}" onChange="{{ e.setLinkQ }}" onKeyDown="{{ e.linkKey }}" placeholder="https://" aria-label="URL del enlace" style="height:40px;box-sizing:border-box;width:100%;padding:0 12px;border-radius:var(--uiux-radius-md);border:1px solid var(--uiux-color-border-strong);background:var(--uiux-color-surface);color:var(--uiux-color-text);font:500 14px var(--uiux-font-family);outline:none;height:34px;flex:1;min-width:200px;width:auto;font-family:var(--uiux-font-mono)" style-focus="border-color:var(--uiux-color-primary);box-shadow:0 0 0 3px var(--uiux-color-focus-ring)"><button type="button" onClick="{{ e.linkApply }}" style="height:34px;padding:0 14px;border-radius:var(--uiux-radius-sm);border:none;background:var(--uiux-color-primary);color:#fff;font:700 12px var(--uiux-font-family);letter-spacing:calc(0.08em * var(--uiux-label-track));text-transform:var(--uiux-label-case);cursor:pointer;display:inline-flex;align-items:center;gap:8px;white-space:nowrap;flex:none;" style-hover="background:var(--uiux-color-primary-hover)" style-focus="outline:none;box-shadow:0 0 0 3px var(--uiux-color-focus-ring)">Aplicar</button><button type="button" onClick="{{ e.linkRemove }}" style="height:34px;padding:0 12px;border-radius:var(--uiux-radius-sm);border:1px solid var(--uiux-color-border-strong);background:transparent;color:var(--uiux-color-text);font:700 12px var(--uiux-font-family);letter-spacing:calc(0.08em * var(--uiux-label-track));text-transform:var(--uiux-label-case);cursor:pointer;display:inline-flex;align-items:center;gap:8px;white-space:nowrap;flex:none;" style-hover="background:var(--uiux-color-surface-secondary)" style-focus="outline:none;box-shadow:0 0 0 3px var(--uiux-color-focus-ring)">Quitar enlace</button><button type="button" onClick="{{ e.linkCancel }}" style="height:34px;padding:0 12px;border-radius:var(--uiux-radius-sm);border:1px solid var(--uiux-color-border-strong);background:transparent;color:var(--uiux-color-text);font:700 12px var(--uiux-font-family);letter-spacing:calc(0.08em * var(--uiux-label-track));text-transform:var(--uiux-label-case);cursor:pointer;display:inline-flex;align-items:center;gap:8px;white-space:nowrap;flex:none;" style-hover="background:var(--uiux-color-surface-secondary)" style-focus="outline:none;box-shadow:0 0 0 3px var(--uiux-color-focus-ring)">Cancelar</button></div></sc-if>
<div ref="{{ e.ref }}" data-uiux-rte="1" contentEditable="{{ e.editable }}" role="textbox" aria-multiline="true" aria-label="{{ e.title }}" onInput="{{ e.onInput }}" onFocus="{{ e.onFocus }}" onBlur="{{ e.onBlur }}" onKeyDown="{{ e.onKeyDown }}" style="display:{{ e.editDisp }};min-height:{{ e.minH }};max-height:420px;overflow-y:auto;box-sizing:border-box;padding:14px 16px;outline:none;font:400 14.5px/1.6 var(--uiux-font-family);color:var(--uiux-color-text)"></div>
<sc-if value="{{ e.src }}" hint-placeholder-val="{{ false }}"><textarea value="{{ e.srcVal }}" onChange="{{ e.onSrc }}" spellCheck="false" aria-label="Código HTML" style="display:block;box-sizing:border-box;width:100%;min-height:220px;padding:14px 16px;border:none;outline:none;resize:vertical;background:#0A0B0C;color:#DCDFE3;font:400 12.5px/1.6 var(--uiux-font-mono)"></textarea></sc-if>
<div style="display:flex;justify-content:space-between;gap:10px;padding:6px 12px;border-top:1px solid var(--uiux-color-border);font:500 12px var(--uiux-font-family);color:var(--uiux-color-text-muted)"><span>{{ e.stat }}</span><span style="font-family:var(--uiux-font-mono);color:{{ e.limitColor }}">{{ e.limit }}</span></div></div></div></sc-for>
<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:24px 20px;align-items:start"><div style="display:flex;flex-direction:column;gap:8px"><span style="font:700 11px var(--uiux-font-family);letter-spacing:calc(0.14em * var(--uiux-label-track));text-transform:var(--uiux-label-case);color:var(--uiux-color-text-muted)">Solo lectura · HTML saneado</span><div style="border:1px solid var(--uiux-color-border);border-radius:var(--uiux-radius-md);padding:14px 16px;background:var(--uiux-color-surface-secondary);font:400 14.5px/1.6 var(--uiux-font-family);color:var(--uiux-color-text);min-height:140px">{{ he.preview }}</div></div><div style="display:flex;flex-direction:column;gap:8px"><span style="font:700 11px var(--uiux-font-family);letter-spacing:calc(0.14em * var(--uiux-label-track));text-transform:var(--uiux-label-case);color:var(--uiux-color-text-muted)">Valor enviado · input hidden</span><pre style="margin:0;min-height:140px;max-height:300px;overflow:auto;box-sizing:border-box;padding:14px 16px;border-radius:var(--uiux-radius-md);background:#0A0B0C;color:#DCDFE3;font:400 12px/1.6 var(--uiux-font-mono);white-space:pre-wrap;word-break:break-word">{{ he.value }}</pre></div></div></div></div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{}">
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
