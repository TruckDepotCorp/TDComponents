<div style="background:var(--uiux-color-surface);border:1px solid var(--uiux-color-border);border-radius:var(--uiux-radius-lg);box-shadow:var(--uiux-shadow-sm);padding:22px;display:flex;flex-direction:column;gap:20px"><div style="display:flex;flex-wrap:wrap;gap:12px;align-items:center"><span style="font:600 13px var(--uiux-font-family)">Miniaturas</span><div role="group" style="display:inline-flex;border:1px solid var(--uiux-color-border-strong);border-radius:var(--uiux-radius-sm);overflow:hidden;flex:none"><sc-for list="{{ md.thumbS }}" as="o" hint-placeholder-count="3"><button type="button" onClick="{{ o.onPick }}" aria-pressed="{{ o.aria }}" style="height:32px;padding:0 12px;border:none;border-left:{{ o.bl }};background:{{ o.bg }};color:{{ o.fg }};font:700 11.5px var(--uiux-font-family);letter-spacing:calc(0.06em * var(--uiux-label-track));text-transform:var(--uiux-label-case);cursor:pointer;white-space:nowrap">{{ o.label }}</button></sc-for></div></div>
<div style="display:grid;grid-template-columns:{{ md.gCols }};gap:10px;max-width:900px"><div role="region" aria-roledescription="galería" aria-label="Fotos del repuesto" tabindex="0" onKeyDown="{{ md.gKey }}" style="position:relative;aspect-ratio:16/9;border-radius:var(--uiux-radius-md);overflow:hidden;outline:none;min-width:0" style-focus="outline:none;box-shadow:0 0 0 3px var(--uiux-color-focus-ring)"><div style="position:relative;width:100%;height:100%;background:{{ md.gCur.bg }};overflow:hidden"><div style="position:absolute;inset:0;background:repeating-linear-gradient(-14deg,rgba(255,255,255,.04) 0 2px,transparent 2px 18px)"></div><span style="position:absolute;left:10px;top:10px;height:20px;padding:0 7px;border-radius:3px;background:rgba(10,11,12,.6);color:#9CA3AB;font:600 10px var(--uiux-font-mono);letter-spacing:.1em;display:inline-flex;align-items:center">FOTO</span><div style="position:absolute;left:0;right:0;bottom:0;padding:10px 12px;display:flex;flex-direction:column;gap:2px;background:rgba(10,11,12,.55)"><span style="font:500 11px var(--uiux-font-mono);color:#9CA3AB">{{ md.gCur.code }}</span><span style="font:600 13px var(--uiux-font-family);color:#F6F7F8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ md.gCur.name }}</span></div></div><button type="button" onClick="{{ md.gPrev }}" aria-label="Foto anterior" style="position:absolute;left:12px;top:50%;margin-top:-20px;width:40px;height:40px;border:none;border-radius:50%;background:rgba(10,11,12,.55);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center" style-hover="background:rgba(10,11,12,.8)" style-focus="outline:none;box-shadow:0 0 0 3px var(--uiux-color-focus-ring)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"></path></svg></button><button type="button" onClick="{{ md.gNext }}" aria-label="Foto siguiente" style="position:absolute;right:12px;top:50%;margin-top:-20px;width:40px;height:40px;border:none;border-radius:50%;background:rgba(10,11,12,.55);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center" style-hover="background:rgba(10,11,12,.8)" style-focus="outline:none;box-shadow:0 0 0 3px var(--uiux-color-focus-ring)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"></path></svg></button><div style="position:absolute;right:12px;top:12px;display:flex;gap:6px"><span style="height:30px;padding:0 10px;border-radius:4px;background:rgba(10,11,12,.6);color:#F6F7F8;font:600 12px var(--uiux-font-mono);display:inline-flex;align-items:center">{{ md.gCount }}</span><button type="button" onClick="{{ md.gFull }}" aria-label="Pantalla completa" title="Pantalla completa" style="width:30px;height:30px;border:none;border-radius:4px;background:rgba(10,11,12,.6);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center" style-hover="background:rgba(10,11,12,.85)" style-focus="outline:none;box-shadow:0 0 0 3px var(--uiux-color-focus-ring)"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6"></path><path d="M9 21H3v-6"></path><path d="M21 3l-7 7"></path><path d="M3 21l7-7"></path></svg></button></div></div>
<sc-if value="{{ md.gThumbs }}" hint-placeholder-val="{{ true }}"><div role="tablist" aria-label="Miniaturas" style="order:{{ md.gOrder }};display:flex;flex-direction:{{ md.gDir }};gap:8px;overflow:auto;min-width:0;max-height:420px"><sc-for list="{{ md.gThumbList }}" as="it" hint-placeholder-count="9"><button type="button" role="tab" aria-selected="{{ it.aria }}" aria-label="{{ it.label }}" onClick="{{ it.onClick }}" style="flex:0 0 auto;width:{{ md.gTW }};aspect-ratio:16/10;padding:0;border:2px solid {{ it.border }};border-radius:var(--uiux-radius-sm);overflow:hidden;cursor:pointer;opacity:{{ it.op }};background:transparent;transition:opacity 120ms" style-hover="opacity:1" style-focus="outline:none;box-shadow:0 0 0 3px var(--uiux-color-focus-ring)"><span style="display:block;width:100%;height:100%;background:{{ it.bg }}"></span></button></sc-for></div></sc-if></div>
<span style="font:500 13px var(--uiux-font-family);color:var(--uiux-color-text-muted)">{{ md.gCur.name }} · ← → cambian de foto · Enter abre pantalla completa</span>
<div style="display:flex;flex-direction:column;gap:10px"><span style="font:700 11px var(--uiux-font-family);letter-spacing:calc(0.14em * var(--uiux-label-track));text-transform:var(--uiux-label-case);color:var(--uiux-color-text-muted)">Grilla · clic abre el visor</span><div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px"><sc-for list="{{ md.grid }}" as="it" hint-placeholder-count="9"><button type="button" onClick="{{ it.onClick }}" aria-label="{{ it.label }}" style="aspect-ratio:4/3;padding:0;border:none;border-radius:var(--uiux-radius-sm);overflow:hidden;cursor:zoom-in;transition:transform 120ms" style-hover="transform:translateY(-1px)" style-focus="outline:none;box-shadow:0 0 0 3px var(--uiux-color-focus-ring)"><div style="position:relative;width:100%;height:100%;background:{{ it.bg }};overflow:hidden"><div style="position:absolute;inset:0;background:repeating-linear-gradient(-14deg,rgba(255,255,255,.04) 0 2px,transparent 2px 18px)"></div><span style="position:absolute;left:10px;top:10px;height:20px;padding:0 7px;border-radius:3px;background:rgba(10,11,12,.6);color:#9CA3AB;font:600 10px var(--uiux-font-mono);letter-spacing:.1em;display:inline-flex;align-items:center">FOTO</span><div style="position:absolute;left:0;right:0;bottom:0;padding:10px 12px;display:flex;flex-direction:column;gap:2px;background:rgba(10,11,12,.55)"><span style="font:500 11px var(--uiux-font-mono);color:#9CA3AB">{{ it.code }}</span><span style="font:600 13px var(--uiux-font-family);color:#F6F7F8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ it.name }}</span></div></div></button></sc-for></div></div></div><sc-if value="{{ md.lbOpen }}" hint-placeholder-val="{{ false }}"><div role="dialog" aria-modal="true" aria-label="Visor de fotos" data-lb="1" tabindex="-1" onKeyDown="{{ md.lbKey }}" onMouseDown="{{ md.lbClose }}" style="position:fixed;inset:0;z-index:90;background:rgba(10,11,12,.94);display:flex;flex-direction:column;outline:none"><div onMouseDown="{{ md.stop }}" style="display:flex;align-items:center;gap:10px;padding:12px 16px;color:#F6F7F8"><span style="font:600 13px var(--uiux-font-mono)">{{ md.gCount }}</span><span style="flex:1;font:600 14px var(--uiux-font-family);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ md.lbCur.name }}</span><button type="button" onClick="{{ md.lbZoom }}" style="height:34px;padding:0 12px;border:1px solid rgba(255,255,255,.28);border-radius:var(--uiux-radius-sm);background:transparent;color:#F6F7F8;font:700 11.5px var(--uiux-font-family);letter-spacing:calc(0.06em * var(--uiux-label-track));text-transform:var(--uiux-label-case);cursor:pointer" style-focus="outline:none;box-shadow:0 0 0 3px var(--uiux-color-focus-ring)">{{ md.zoomL }}</button><button type="button" onClick="{{ md.lbClose }}" aria-label="Cerrar" style="width:34px;height:34px;border:none;border-radius:50%;background:rgba(255,255,255,.12);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center" style-focus="outline:none;box-shadow:0 0 0 3px var(--uiux-color-focus-ring)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M18 6 6 18"></path><path d="M6 6l12 12"></path></svg></button></div><div style="flex:1;min-height:0;display:flex;align-items:center;justify-content:center;gap:12px;padding:0 16px"><button type="button" onMouseDown="{{ md.stop }}" onClick="{{ md.gPrev }}" aria-label="Foto anterior" style="width:44px;height:44px;flex:none;border:none;border-radius:50%;background:rgba(255,255,255,.12);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center" style-focus="outline:none;box-shadow:0 0 0 3px var(--uiux-color-focus-ring)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"></path></svg></button><div onMouseDown="{{ md.stop }}" onClick="{{ md.lbZoom }}" style="width:min(1000px,100%);aspect-ratio:16/9;max-height:100%;border-radius:var(--uiux-radius-md);overflow:hidden;cursor:{{ md.lbCursor }}"><div style="width:100%;height:100%;transform:{{ md.lbScale }};transition:transform 220ms cubic-bezier(.2,.7,.2,1)"><div style="position:relative;width:100%;height:100%;background:{{ md.lbCur.bg }};overflow:hidden"><div style="position:absolute;inset:0;background:repeating-linear-gradient(-14deg,rgba(255,255,255,.04) 0 2px,transparent 2px 18px)"></div><span style="position:absolute;left:10px;top:10px;height:20px;padding:0 7px;border-radius:3px;background:rgba(10,11,12,.6);color:#9CA3AB;font:600 10px var(--uiux-font-mono);letter-spacing:.1em;display:inline-flex;align-items:center">FOTO</span><div style="position:absolute;left:0;right:0;bottom:0;padding:10px 12px;display:flex;flex-direction:column;gap:2px;background:rgba(10,11,12,.55)"><span style="font:500 11px var(--uiux-font-mono);color:#9CA3AB">{{ md.lbCur.code }}</span><span style="font:600 13px var(--uiux-font-family);color:#F6F7F8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ md.lbCur.name }}</span></div></div></div></div><button type="button" onMouseDown="{{ md.stop }}" onClick="{{ md.gNext }}" aria-label="Foto siguiente" style="width:44px;height:44px;flex:none;border:none;border-radius:50%;background:rgba(255,255,255,.12);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center" style-focus="outline:none;box-shadow:0 0 0 3px var(--uiux-color-focus-ring)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"></path></svg></button></div><div onMouseDown="{{ md.stop }}" style="display:flex;justify-content:center;gap:8px;padding:14px;overflow-x:auto"><sc-for list="{{ md.gThumbList }}" as="it" hint-placeholder-count="9"><button type="button" aria-label="{{ it.label }}" aria-current="{{ it.aria }}" onClick="{{ it.onClick }}" style="flex:none;width:72px;aspect-ratio:16/10;padding:0;border:2px solid {{ it.border }};border-radius:4px;overflow:hidden;cursor:pointer;opacity:{{ it.op }};background:transparent" style-focus="outline:none;box-shadow:0 0 0 3px var(--uiux-color-focus-ring)"><span style="display:block;width:100%;height:100%;background:{{ it.bg }}"></span></button></sc-for></div></div></sc-if>
