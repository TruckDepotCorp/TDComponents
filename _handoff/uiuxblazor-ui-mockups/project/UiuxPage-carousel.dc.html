<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>

<div style="background:var(--uiux-color-surface);border:1px solid var(--uiux-color-border);border-radius:var(--uiux-radius-lg);box-shadow:var(--uiux-shadow-sm);padding:22px;display:flex;flex-direction:column;gap:20px"><div style="display:flex;flex-direction:column;gap:10px;min-width:0"><span style="font:700 11px var(--uiux-font-family);letter-spacing:calc(0.14em * var(--uiux-label-track));text-transform:var(--uiux-label-case);color:var(--uiux-color-text-muted)">Banner · rotación automática</span><div role="region" aria-roledescription="carrusel" aria-label="Destacados" tabindex="0" onKeyDown="{{ nv.carKey }}" onMouseEnter="{{ nv.carIn }}" onMouseLeave="{{ nv.carOut }}" style="position:relative;border-radius:var(--uiux-radius-lg);overflow:hidden;background:#0A0B0C;outline:none" style-focus="box-shadow:0 0 0 3px var(--uiux-color-focus-ring)"><div style="display:flex;transform:{{ nv.carTf }};transition:transform 420ms cubic-bezier(.2,.7,.2,1)"><sc-for list="{{ nv.slides }}" as="sl" hint-placeholder-count="1"><div role="group" aria-roledescription="diapositiva" aria-label="{{ sl.aria }}" aria-hidden="{{ sl.hidden }}" style="flex:0 0 100%;min-height:250px;box-sizing:border-box;padding:36px 72px 52px;display:flex;flex-direction:column;justify-content:center;gap:10px;color:#F6F7F8;background:{{ sl.bg }}"><span style="font:700 11px var(--uiux-font-family);letter-spacing:.14em;text-transform:uppercase;color:{{ sl.acc }}">{{ sl.eyebrow }}</span><span style="font:var(--uiux-display-style) var(--uiux-display-weight, 900) clamp(28px,4vw,44px)/1.02 var(--uiux-font-display);text-transform:var(--uiux-display-case)">{{ sl.title }}</span><span style="font:500 15px/1.5 var(--uiux-font-family);color:#DCDFE3;max-width:460px;text-wrap:pretty">{{ sl.text }}</span><span style="display:flex;margin-top:8px"><button type="button" tabindex="{{ sl.ti }}" style="height:40px;padding:0 18px;border:none;border-radius:var(--uiux-radius-sm);background:#F6F7F8;color:#0A0B0C;font:700 12px var(--uiux-font-family);letter-spacing:calc(0.08em * var(--uiux-label-track));text-transform:var(--uiux-label-case);cursor:pointer" style-focus="outline:none;box-shadow:0 0 0 3px var(--uiux-color-focus-ring)">{{ sl.cta }}</button></span></div></sc-for></div><button type="button" onClick="{{ nv.carPrev }}" aria-label="Anterior" style="position:absolute;left:14px;top:50%;margin-top:-20px;width:40px;height:40px;border-radius:50%;border:none;background:rgba(255,255,255,.16);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;" style-hover="background:rgba(255,255,255,.3)" style-focus="outline:none;box-shadow:0 0 0 3px var(--uiux-color-focus-ring)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"></path></svg></button><button type="button" onClick="{{ nv.carNext }}" aria-label="Siguiente" style="position:absolute;right:14px;top:50%;margin-top:-20px;width:40px;height:40px;border-radius:50%;border:none;background:rgba(255,255,255,.16);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;" style-hover="background:rgba(255,255,255,.3)" style-focus="outline:none;box-shadow:0 0 0 3px var(--uiux-color-focus-ring)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"></path></svg></button><div style="position:absolute;left:0;right:0;bottom:18px;display:flex;justify-content:center;gap:6px"><sc-for list="{{ nv.dots }}" as="dt" hint-placeholder-count="4"><button type="button" onClick="{{ dt.onClick }}" aria-label="{{ dt.label }}" aria-current="{{ dt.aria }}" style="width:{{ dt.w }};height:8px;padding:0;border:none;border-radius:999px;background:{{ dt.bg }};cursor:pointer;transition:width 200ms" style-focus="outline:none;box-shadow:0 0 0 3px var(--uiux-color-focus-ring)"></button></sc-for></div><button type="button" onClick="{{ nv.onPlay }}" aria-label="{{ nv.playLabel }}" title="{{ nv.playLabel }}" style="position:absolute;right:14px;bottom:10px;width:30px;height:30px;border-radius:50%;border:none;background:rgba(255,255,255,.16);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center" style-focus="outline:none;box-shadow:0 0 0 3px var(--uiux-color-focus-ring)"><span style="display:flex">{{ nv.playIcon }}</span></button></div><span style="font:500 13px var(--uiux-font-family);color:var(--uiux-color-text-muted);min-height:18px">{{ nv.carLive }}</span></div><div style="display:flex;flex-direction:column;gap:10px;min-width:0"><span style="font:700 11px var(--uiux-font-family);letter-spacing:calc(0.14em * var(--uiux-label-track));text-transform:var(--uiux-label-case);color:var(--uiux-color-text-muted)">Tarjetas · 3 por vista</span><div style="overflow:hidden"><div style="display:flex;gap:16px;transform:{{ nv.cardTf }};transition:transform 320ms cubic-bezier(.2,.7,.2,1)"><sc-for list="{{ nv.cards }}" as="c" hint-placeholder-count="3"><div style="flex:0 0 calc((100% - 32px) / 3);box-sizing:border-box;min-width:0;padding:16px;border:1px solid var(--uiux-color-border);border-radius:var(--uiux-radius-md);background:var(--uiux-color-surface);display:flex;flex-direction:column;gap:6px"><span style="font:500 11.5px var(--uiux-font-mono);color:var(--uiux-color-text-muted)">{{ c.code }} · {{ c.brand }}</span><span style="font:600 15px var(--uiux-font-family);min-height:40px">{{ c.name }}</span><span style="font:600 12.5px var(--uiux-font-family);color:{{ c.stColor }}">{{ c.stock }}</span><span style="font:var(--uiux-display-style) var(--uiux-display-weight, 800) 22px var(--uiux-font-display)">{{ c.price }}</span></div></sc-for></div></div><div style="display:flex;gap:14px;flex-wrap:wrap;align-items:center"><button type="button" onClick="{{ nv.cardPrev }}" disabled="{{ nv.cardPrevDis }}" aria-label="Anteriores" style="height:36px;padding:0 12px;border-radius:var(--uiux-radius-sm);border:1px solid var(--uiux-color-border-strong);background:transparent;color:var(--uiux-color-text);font:700 12px var(--uiux-font-family);letter-spacing:calc(0.08em * var(--uiux-label-track));text-transform:var(--uiux-label-case);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;flex:none;text-decoration:none;width:36px;padding:0;opacity:{{ nv.cardPrevOp }}" style-hover="background:var(--uiux-color-surface-secondary);text-decoration:none;color:var(--uiux-color-text)" style-active="transform:scale(.98)" style-focus="outline:none;box-shadow:0 0 0 3px var(--uiux-color-focus-ring)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"></path></svg></button><button type="button" onClick="{{ nv.cardNext }}" disabled="{{ nv.cardNextDis }}" aria-label="Siguientes" style="height:36px;padding:0 12px;border-radius:var(--uiux-radius-sm);border:1px solid var(--uiux-color-border-strong);background:transparent;color:var(--uiux-color-text);font:700 12px var(--uiux-font-family);letter-spacing:calc(0.08em * var(--uiux-label-track));text-transform:var(--uiux-label-case);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;flex:none;text-decoration:none;width:36px;padding:0;opacity:{{ nv.cardNextOp }}" style-hover="background:var(--uiux-color-surface-secondary);text-decoration:none;color:var(--uiux-color-text)" style-active="transform:scale(.98)" style-focus="outline:none;box-shadow:0 0 0 3px var(--uiux-color-focus-ring)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"></path></svg></button><span style="font:500 12.5px var(--uiux-font-mono);color:var(--uiux-color-text-muted)">{{ nv.cardMeta }}</span></div></div></div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{}">
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
