<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>

<div style="background:var(--uiux-color-surface);border:1px solid var(--uiux-color-border);border-radius:var(--uiux-radius-lg);box-shadow:var(--uiux-shadow-sm);padding:22px;display:flex;flex-direction:column;gap:20px"><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px;align-items:start"><div style="display:flex;flex-direction:column;gap:6px;min-width:0;grid-column:1 / -1"><label for="tbi" style="font:600 13px var(--uiux-font-family)">Con botones de ícono al inicio y al final</label>
<div style="display:flex;align-items:center;gap:2px;height:44px;box-sizing:border-box;max-width:600px;padding:0 4px;border:1px solid {{ fm.tbiBorder }};border-radius:var(--uiux-radius-md);background:var(--uiux-color-surface);box-shadow:{{ fm.tbiRing }};transition:border-color 120ms,box-shadow 120ms">
<button type="button" onClick="{{ fm.tbiScan }}" aria-label="Escanear código de barras" title="Escanear código de barras" style="width:36px;height:36px;flex:none;border:none;border-radius:var(--uiux-radius-sm);background:transparent;color:var(--uiux-color-text-muted);cursor:pointer;display:flex;align-items:center;justify-content:center;" style-hover="background:var(--uiux-color-surface-secondary);color:var(--uiux-color-text)" style-focus="outline:none;box-shadow:0 0 0 3px var(--uiux-color-focus-ring)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2M8 7v10M12 7v10M17 7v10"></path></svg></button><button type="button" onClick="{{ fm.tbiMode }}" aria-label="Cambiar campo de búsqueda" title="Cambiar campo de búsqueda" style="width:36px;height:36px;flex:none;border:none;border-radius:var(--uiux-radius-sm);background:transparent;color:var(--uiux-color-text-muted);cursor:pointer;display:flex;align-items:center;justify-content:center;" style-hover="background:var(--uiux-color-surface-secondary);color:var(--uiux-color-text)" style-focus="outline:none;box-shadow:0 0 0 3px var(--uiux-color-focus-ring)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 3H2l8 9.46V19l4 2v-8.54L22 3z"></path></svg></button>
<span style="flex:none;height:22px;padding:0 8px;margin:0 4px 0 2px;border-radius:999px;background:var(--uiux-color-surface-secondary);font:600 11.5px var(--uiux-font-family);color:var(--uiux-color-text-muted);display:flex;align-items:center">{{ fm.tbiModeLabel }}</span>
<input id="tbi" value="{{ fm.tbi }}" onChange="{{ fm.setTbi }}" onKeyDown="{{ fm.tbiKey }}" onFocus="{{ fm.tbiOnFocus }}" onBlur="{{ fm.tbiOnBlur }}" placeholder="{{ fm.tbiPh }}" style="flex:1;min-width:0;height:100%;border:none;outline:none;background:transparent;color:var(--uiux-color-text);font:{{ fm.tbiFont }}">
<sc-if value="{{ fm.tbiHas }}" hint-placeholder-val="{{ false }}"><button type="button" onClick="{{ fm.tbiClear }}" aria-label="Borrar texto" title="Borrar texto" style="width:36px;height:36px;flex:none;border:none;border-radius:var(--uiux-radius-sm);background:transparent;color:var(--uiux-color-text-muted);cursor:pointer;display:flex;align-items:center;justify-content:center;" style-hover="background:var(--uiux-color-surface-secondary);color:var(--uiux-color-text)" style-focus="outline:none;box-shadow:0 0 0 3px var(--uiux-color-focus-ring)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"></path></svg></button></sc-if>
<button type="button" onClick="{{ fm.tbiMic }}" aria-label="Dictar" title="Dictar" style="width:36px;height:36px;flex:none;border:none;border-radius:var(--uiux-radius-sm);background:transparent;color:var(--uiux-color-text-muted);cursor:pointer;display:flex;align-items:center;justify-content:center;" style-hover="background:var(--uiux-color-surface-secondary);color:var(--uiux-color-text)" style-focus="outline:none;box-shadow:0 0 0 3px var(--uiux-color-focus-ring)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2M12 19v3"></path></svg></button>
<button type="button" onClick="{{ fm.tbiSearch }}" aria-label="Buscar" title="Buscar" style="width:36px;height:36px;flex:none;border:none;border-radius:var(--uiux-radius-sm);background:var(--uiux-color-primary);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center" style-hover="background:var(--uiux-color-primary-hover)" style-active="transform:scale(.96)" style-focus="outline:none;box-shadow:0 0 0 3px var(--uiux-color-focus-ring)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path></svg></button>
</div><span style="font:500 12.5px var(--uiux-font-family);color:{{ fm.tbiMsgColor }}">{{ fm.tbiMsg }}</span></div>
<div style="display:flex;flex-direction:column;gap:6px;min-width:0"><label style="font:600 13px var(--uiux-font-family)">Básico</label><input value="{{ fm.tb }}" onChange="{{ fm.setTb }}" placeholder="Escribe aquí…" style="height:40px;box-sizing:border-box;width:100%;padding:0 12px;border-radius:var(--uiux-radius-md);border:1px solid var(--uiux-color-border-strong);background:var(--uiux-color-surface);color:var(--uiux-color-text);font:500 14px var(--uiux-font-family);outline:none;" style-focus="border-color:var(--uiux-color-primary);box-shadow:0 0 0 3px var(--uiux-color-focus-ring)"></div><div style="display:flex;flex-direction:column;gap:6px;min-width:0"><label style="font:600 13px var(--uiux-font-family)">Con ícono</label><div style="position:relative"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="position:absolute;left:12px;top:12px;color:var(--uiux-color-text-muted)"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path></svg><input placeholder="Buscar repuesto" style="height:40px;box-sizing:border-box;width:100%;padding:0 12px;border-radius:var(--uiux-radius-md);border:1px solid var(--uiux-color-border-strong);background:var(--uiux-color-surface);color:var(--uiux-color-text);font:500 14px var(--uiux-font-family);outline:none;padding-left:36px" style-focus="border-color:var(--uiux-color-primary);box-shadow:0 0 0 3px var(--uiux-color-focus-ring)"></div></div><div style="display:flex;flex-direction:column;gap:6px;min-width:0"><label style="font:600 13px var(--uiux-font-family)">Con borrar</label><div style="position:relative"><input value="{{ fm.tbc }}" onChange="{{ fm.setTbc }}" style="height:40px;box-sizing:border-box;width:100%;padding:0 12px;border-radius:var(--uiux-radius-md);border:1px solid var(--uiux-color-border-strong);background:var(--uiux-color-surface);color:var(--uiux-color-text);font:500 14px var(--uiux-font-family);outline:none;padding-right:36px" style-focus="border-color:var(--uiux-color-primary);box-shadow:0 0 0 3px var(--uiux-color-focus-ring)"><sc-if value="{{ fm.tbcHas }}" hint-placeholder-val="{{ true }}"><button onClick="{{ fm.clearTbc }}" aria-label="Borrar" style="position:absolute;right:6px;top:6px;width:28px;height:28px;border:none;border-radius:50%;background:transparent;color:var(--uiux-color-text-muted);cursor:pointer;display:flex;align-items:center;justify-content:center" style-hover="background:var(--uiux-color-surface-secondary)"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"></path></svg></button></sc-if></div></div><div style="display:flex;flex-direction:column;gap:6px;min-width:0"><label style="font:600 13px var(--uiux-font-family)">Contador</label><input value="{{ fm.tbn }}" onChange="{{ fm.setTbn }}" maxLength="40" style="height:40px;box-sizing:border-box;width:100%;padding:0 12px;border-radius:var(--uiux-radius-md);border:1px solid var(--uiux-color-border-strong);background:var(--uiux-color-surface);color:var(--uiux-color-text);font:500 14px var(--uiux-font-family);outline:none;" style-focus="border-color:var(--uiux-color-primary);box-shadow:0 0 0 3px var(--uiux-color-focus-ring)"><span style="font:500 12.5px var(--uiux-font-family);color:var(--uiux-color-text-muted)"><span style="display:flex;justify-content:flex-end">{{ fm.tbnCount }}</span></span></div><div style="display:flex;flex-direction:column;gap:6px;min-width:0"><label style="font:600 13px var(--uiux-font-family)">Deshabilitado</label><input value="No editable" disabled="{{ true }}" style="height:40px;box-sizing:border-box;width:100%;padding:0 12px;border-radius:var(--uiux-radius-md);border:1px solid var(--uiux-color-border-strong);background:var(--uiux-color-surface);color:var(--uiux-color-text);font:500 14px var(--uiux-font-family);outline:none;opacity:.55;cursor:not-allowed;background:var(--uiux-color-surface-secondary)" style-focus="border-color:var(--uiux-color-primary);box-shadow:0 0 0 3px var(--uiux-color-focus-ring)"></div><div style="display:flex;flex-direction:column;gap:6px;min-width:0"><label style="font:600 13px var(--uiux-font-family)">Solo lectura</label><input value="OC-2026-00481" readOnly="{{ true }}" style="height:40px;box-sizing:border-box;width:100%;padding:0 12px;border-radius:var(--uiux-radius-md);border:1px solid var(--uiux-color-border-strong);background:var(--uiux-color-surface);color:var(--uiux-color-text);font:500 14px var(--uiux-font-family);outline:none;background:var(--uiux-color-surface-secondary);font-family:var(--uiux-font-mono)" style-focus="border-color:var(--uiux-color-primary);box-shadow:0 0 0 3px var(--uiux-color-focus-ring)"></div></div></div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{}">
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
