<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>

<div style="background:var(--uiux-color-surface);border:1px solid var(--uiux-color-border);border-radius:var(--uiux-radius-lg);box-shadow:var(--uiux-shadow-sm);padding:22px;display:flex;flex-direction:column;gap:20px"><div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:24px 20px;align-items:start"><sc-for list="{{ dd.singles }}" as="d" hint-placeholder-count="9"><div style="display:flex;flex-direction:column;gap:6px;min-width:0"><span style="font:700 11px var(--uiux-font-family);letter-spacing:calc(0.14em * var(--uiux-label-track));text-transform:var(--uiux-label-case);color:var(--uiux-color-text-muted)">{{ d.title }}</span><div style="position:relative">
<button type="button" role="combobox" aria-haspopup="listbox" aria-expanded="{{ d.openS }}" disabled="{{ d.disabled }}" data-dd-trigger="{{ d.key }}" onClick="{{ d.onToggle }}" onKeyDown="{{ d.onKey }}" style="height:40px;box-sizing:border-box;width:100%;padding:0 12px;display:flex;align-items:center;gap:8px;border-radius:var(--uiux-radius-md);border:1px solid {{ d.border }};background:{{ d.fieldBg }};color:var(--uiux-color-text);font:500 14px var(--uiux-font-family);text-align:left;cursor:{{ d.cursor }};opacity:{{ d.dim }};box-shadow:{{ d.ring }};outline:none" style-focus="border-color:var(--uiux-color-primary);box-shadow:0 0 0 3px var(--uiux-color-focus-ring)"><span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:{{ d.textColor }}">{{ d.text }}</span><span style="font:500 11.5px var(--uiux-font-mono);color:var(--uiux-color-text-muted);white-space:nowrap">{{ d.textSub }}</span><span style="width:{{ d.clrW }};flex:none"></span><span style="display:flex;color:var(--uiux-color-text-muted);transform:{{ d.rot }};transition:transform 150ms"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"></path></svg></span></button><sc-if value="{{ d.hasClear }}" hint-placeholder-val="{{ false }}"><button type="button" onClick="{{ d.onClear }}" aria-label="Borrar selección" title="Borrar" style="position:absolute;right:34px;top:6px;width:28px;height:28px;border:none;border-radius:50%;background:transparent;color:var(--uiux-color-text-muted);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0" style-hover="background:var(--uiux-color-surface-secondary);color:var(--uiux-color-text)" style-focus="outline:none;box-shadow:0 0 0 3px var(--uiux-color-focus-ring)"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"></path></svg></button></sc-if>
<sc-if value="{{ d.open }}" hint-placeholder-val="{{ false }}"><div onMouseDown="{{ d.onClose }}" style="position:fixed;inset:0;z-index:25"></div><div style="position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:30;min-width:250px;background:var(--uiux-color-surface);border:1px solid var(--uiux-color-border);border-radius:var(--uiux-radius-md);box-shadow:var(--uiux-shadow-lg);overflow:hidden"><sc-if value="{{ d.searchable }}" hint-placeholder-val="{{ false }}"><div style="padding:8px;border-bottom:1px solid var(--uiux-color-border);display:flex"><div style="position:relative;flex:1;min-width:0"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="position:absolute;left:10px;top:11px;color:var(--uiux-color-text-muted)"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path></svg><input autoFocus="{{ true }}" value="{{ d.q }}" onChange="{{ d.setQ }}" onKeyDown="{{ d.onKey }}" placeholder="{{ d.qPh }}" aria-label="Buscar" style="height:40px;box-sizing:border-box;width:100%;padding:0 12px;border-radius:var(--uiux-radius-md);border:1px solid var(--uiux-color-border-strong);background:var(--uiux-color-surface);color:var(--uiux-color-text);font:500 14px var(--uiux-font-family);outline:none;height:36px;padding-left:30px" style-focus="border-color:var(--uiux-color-primary);box-shadow:0 0 0 3px var(--uiux-color-focus-ring)"></div></div></sc-if>
<div role="listbox" data-dd-list="{{ d.key }}" onScroll="{{ d.onScroll }}" style="max-height:252px;overflow-y:auto;padding:4px;position:relative"><div style="padding-top:{{ d.padTop }};padding-bottom:{{ d.padBot }};display:flex;flex-direction:column"><sc-for list="{{ d.items }}" as="o" hint-placeholder-count="0">
<sc-if value="{{ o.isGroup }}" hint-placeholder-val="{{ false }}"><div style="height:28px;display:flex;align-items:flex-end;padding:0 10px 4px;font:700 10.5px var(--uiux-font-family);letter-spacing:calc(0.12em * var(--uiux-label-track));text-transform:var(--uiux-label-case);color:var(--uiux-color-text-muted)">{{ o.label }}</div></sc-if>
<sc-if value="{{ o.isOpt }}" hint-placeholder-val="{{ false }}"><div role="option" aria-selected="{{ o.aria }}" aria-disabled="{{ o.dis }}" data-hi="{{ o.hiS }}" onMouseDown="{{ o.onPick }}" onMouseEnter="{{ o.onHover }}" style="display:flex;align-items:center;gap:10px;height:36px;flex:none;box-sizing:border-box;padding:0 10px;border-radius:5px;background:{{ o.bg }};box-shadow:{{ o.bar }};opacity:{{ o.dim }};cursor:{{ o.cursor }}"><span style="display:flex;width:14px;color:var(--uiux-color-primary);opacity:{{ o.chk }}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"></path></svg></span><span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font:{{ o.font }};color:{{ o.color }}">{{ o.label }}</span><span style="font:500 11.5px var(--uiux-font-mono);color:{{ o.subColor }};white-space:nowrap">{{ o.sub }}</span><span style="font:700 12.5px var(--uiux-font-mono);white-space:nowrap">{{ o.right }}</span></div></sc-if>
</sc-for></div><sc-if value="{{ d.none }}" hint-placeholder-val="{{ false }}"><div style="padding:14px 10px;font-size:13.5px;color:var(--uiux-color-text-muted)">Sin resultados</div></sc-if></div><sc-if value="{{ d.hasFoot }}" hint-placeholder-val="{{ false }}"><div style="padding:7px 12px;border-top:1px solid var(--uiux-color-border);background:var(--uiux-color-surface-secondary);font:500 11.5px var(--uiux-font-mono);color:var(--uiux-color-text-muted)">{{ d.foot }}</div></sc-if></div></sc-if></div><span style="font:500 12.5px var(--uiux-font-family);color:var(--uiux-color-text-muted)">{{ d.hint }}</span><span style="font:500 11.5px var(--uiux-font-mono);color:var(--uiux-color-text-muted)">{{ d.val }}</span></div></sc-for></div></div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{}">
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
