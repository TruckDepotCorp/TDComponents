<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>

<div style="background:var(--uiux-color-surface);border:1px solid var(--uiux-color-border);border-radius:var(--uiux-radius-lg);box-shadow:var(--uiux-shadow-sm);padding:22px;display:flex;flex-direction:column;gap:20px"><div style="display:flex;gap:28px;flex-wrap:wrap;align-items:flex-start"><sc-for list="{{ nv.profs }}" as="p" hint-placeholder-count="3"><div style="display:flex;flex-direction:column;gap:10px;min-width:0"><span style="font:700 11px var(--uiux-font-family);letter-spacing:calc(0.14em * var(--uiux-label-track));text-transform:var(--uiux-label-case);color:var(--uiux-color-text-muted)">{{ p.title }}</span><div style="position:relative;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:{{ p.pad }};background:{{ p.barBg }};border-radius:var(--uiux-radius-md);min-width:{{ p.minW }};box-sizing:border-box"><sc-if value="{{ p.isC }}" hint-placeholder-val="{{ false }}"><span style="font:var(--uiux-display-style) var(--uiux-display-weight, 800) 16px var(--uiux-font-display);text-transform:var(--uiux-display-case);color:var(--uiux-color-header-fg)">Panel de flota</span></sc-if><div style="display:flex;align-items:center;gap:10px"><sc-if value="{{ p.isC }}" hint-placeholder-val="{{ false }}"><button type="button" aria-label="Avisos · 2 sin leer" style="position:relative;width:36px;height:36px;border:none;border-radius:50%;background:transparent;color:var(--uiux-color-header-fg);cursor:pointer;display:flex;align-items:center;justify-content:center" style-focus="outline:none;box-shadow:0 0 0 3px var(--uiux-color-focus-ring)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"></path></svg><span style="position:absolute;top:5px;right:6px;width:8px;height:8px;border-radius:50%;background:var(--uiux-color-primary);box-shadow:0 0 0 2px var(--uiux-color-header-bg)"></span></button></sc-if><button type="button" aria-haspopup="menu" aria-expanded="{{ p.aria }}" data-pt="{{ p.key }}" onClick="{{ p.onToggle }}" onKeyDown="{{ p.onKey }}" style="display:flex;align-items:center;gap:10px;padding:{{ p.btnPad }};border:{{ p.btnBorder }};border-radius:999px;background:transparent;color:{{ p.fg }};cursor:pointer" style-hover="opacity:.85" style-focus="outline:none;box-shadow:0 0 0 3px var(--uiux-color-focus-ring)"><span style="width:34px;height:34px;border-radius:50%;background:var(--uiux-color-primary);color:#fff;font:700 12px var(--uiux-font-mono);display:flex;align-items:center;justify-content:center;flex:none">{{ nv.user.ini }}</span><sc-if value="{{ p.showName }}" hint-placeholder-val="{{ false }}"><span style="display:flex;flex-direction:column;align-items:flex-start;line-height:1.2"><span style="font:600 14px var(--uiux-font-family)">{{ nv.user.name }}</span><span style="font:500 12px var(--uiux-font-family);color:{{ p.subC }}">Flota 42</span></span><span style="display:flex;color:{{ p.subC }}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"></path></svg></span></sc-if></button></div><sc-if value="{{ p.open }}" hint-placeholder-val="{{ false }}"><div onMouseDown="{{ p.onClose }}" style="position:fixed;inset:0;z-index:25"></div><div role="menu" data-pm="{{ p.key }}" onKeyDown="{{ p.menuKey }}" style="position:absolute;right:{{ p.popR }};top:calc(100% + 8px);z-index:30;width:290px;overflow:hidden;background:var(--uiux-color-surface);border:1px solid var(--uiux-color-border);border-radius:var(--uiux-radius-md);box-shadow:var(--uiux-shadow-lg)"><div style="display:flex;gap:12px;align-items:center;padding:16px;border-bottom:1px solid var(--uiux-color-border)"><span style="width:44px;height:44px;border-radius:50%;background:var(--uiux-color-primary);color:#fff;font:700 14px var(--uiux-font-mono);display:flex;align-items:center;justify-content:center;flex:none">{{ nv.user.ini }}</span><span style="display:flex;flex-direction:column;gap:2px;min-width:0"><span style="font:700 15px var(--uiux-font-family);color:var(--uiux-color-text)">{{ nv.user.name }}</span><span style="font:500 12.5px var(--uiux-font-family);color:var(--uiux-color-text-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{ nv.user.mail }}</span><span style="font:500 11.5px var(--uiux-font-mono);color:var(--uiux-color-text-muted)">{{ nv.user.org }}</span></span></div><div style="padding:6px"><sc-for list="{{ nv.profItems }}" as="it" hint-placeholder-count="4"><button type="button" role="menuitem" data-pmi="1" onClick="{{ it.onClick }}" style="width:100%;display:flex;align-items:center;gap:10px;height:36px;padding:0 10px;border:none;border-radius:5px;background:transparent;color:var(--uiux-color-text);font:500 14px var(--uiux-font-family);text-align:left;cursor:pointer;text-decoration:none;" style-hover="background:var(--uiux-color-surface-secondary);text-decoration:none" style-focus="outline:none;background:var(--uiux-color-surface-secondary)"><span style="display:flex;color:var(--uiux-color-text-muted)">{{ it.icon }}</span><span style="flex:1">{{ it.label }}</span><sc-if value="{{ it.hasBadge }}" hint-placeholder-val="{{ false }}"><span style="min-width:22px;height:20px;padding:0 7px;box-sizing:border-box;border-radius:999px;background:var(--uiux-color-surface-secondary);border:1px solid var(--uiux-color-border);font:700 11px var(--uiux-font-mono);color:var(--uiux-color-text);display:inline-flex;align-items:center;justify-content:center">{{ it.badge }}</span></sc-if></button></sc-for></div><div style="padding:10px 16px;border-top:1px solid var(--uiux-color-border)"><button type="button" role="switch" aria-checked="{{ nv.profNotif.aria }}" onClick="{{ nv.profNotif.onToggle }}" style="display:flex;align-items:center;gap:10px;padding:0;border:none;background:transparent;color:var(--uiux-color-text);font:500 14px var(--uiux-font-family);cursor:pointer;border-radius:999px;text-align:left" style-focus="outline:none;box-shadow:0 0 0 3px var(--uiux-color-focus-ring)"><span style="width:36px;height:20px;border-radius:999px;background:{{ nv.profNotif.bg }};position:relative;flex:none;transition:background 120ms"><span style="position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:#fff;transform:{{ nv.profNotif.tf }};transition:transform 120ms"></span></span>{{ nv.profNotif.label }}</button></div><div style="padding:6px;border-top:1px solid var(--uiux-color-border)"><button type="button" role="menuitem" data-pmi="1" onClick="{{ nv.profLogout }}" style="width:100%;display:flex;align-items:center;gap:10px;height:36px;padding:0 10px;border:none;border-radius:5px;background:transparent;color:var(--uiux-color-text);font:500 14px var(--uiux-font-family);text-align:left;cursor:pointer;text-decoration:none;color:var(--uiux-color-danger)" style-hover="background:var(--uiux-color-surface-secondary);text-decoration:none" style-focus="outline:none;background:var(--uiux-color-surface-secondary)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><path d="m16 17 5-5-5-5"></path><path d="M21 12H9"></path></svg>Cerrar sesión</button></div></div></sc-if></div></div></sc-for></div><span style="font:500 13px var(--uiux-font-family);color:var(--uiux-color-text-muted);min-height:18px">{{ nv.profMsg }}</span></div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{}">
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
