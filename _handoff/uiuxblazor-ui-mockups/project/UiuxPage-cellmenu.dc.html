<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>

<div style="display:flex;flex-direction:column;gap:14px">
<span style="font-size:13px;color:var(--uiux-color-text-muted)">Clic derecho en cualquier celda. Con teclado: flechas para moverte entre celdas y Shift + F10 (o la tecla Menú) para abrirlo.</span>
<sc-if value="{{ cm.hasChips }}" hint-placeholder-val="{{ false }}"><div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap"><span style="font:700 11px var(--uiux-font-family);letter-spacing:calc(0.12em * var(--uiux-label-track));text-transform:var(--uiux-label-case);color:var(--uiux-color-text-muted)">Aplicado</span><sc-for list="{{ cm.chips }}" as="ch" hint-placeholder-count="1"><span style="display:inline-flex;align-items:center;gap:4px;height:28px;padding:0 4px 0 10px;border-radius:999px;background:color-mix(in srgb, var(--uiux-color-primary) 10%, transparent);border:1px solid color-mix(in srgb, var(--uiux-color-primary) 35%, transparent);font:600 12.5px var(--uiux-font-family)">{{ ch.label }}<button onClick="{{ ch.onRemove }}" aria-label="Quitar" style="width:20px;height:20px;border:none;border-radius:50%;background:transparent;color:var(--uiux-color-text-muted);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"></path></svg></button></span></sc-for><button onClick="{{ cm.clearAll }}" style="border:none;background:transparent;color:var(--uiux-color-primary);font:700 12px var(--uiux-font-family);letter-spacing:calc(0.08em * var(--uiux-label-track));text-transform:var(--uiux-label-case);cursor:pointer">Limpiar</button></div></sc-if>
<div ref="{{ cm.ref }}" style="position:relative;background:var(--uiux-color-surface);border:1px solid var(--uiux-color-border);border-radius:var(--uiux-radius-lg);box-shadow:var(--uiux-shadow-sm)">
<div style="overflow-x:auto;border-radius:var(--uiux-radius-lg) var(--uiux-radius-lg) 0 0"><table role="grid" style="width:100%;border-collapse:collapse;font-size:14px;text-align:left">
<thead><tr><sc-for list="{{ cm.heads }}" as="h" hint-placeholder-count="6"><th aria-sort="{{ h.ariaSort }}" style="padding:0 12px;height:40px;background:var(--uiux-color-surface-secondary);border-bottom:1px solid var(--uiux-color-border);font:700 11px var(--uiux-font-family);letter-spacing:calc(0.12em * var(--uiux-label-track));text-transform:var(--uiux-label-case);color:var(--uiux-color-text-muted);white-space:nowrap;text-align:{{ h.align }}"><span style="display:inline-flex;align-items:center;gap:6px;color:{{ h.color }}">{{ h.label }}<sc-if value="{{ h.sAsc }}" hint-placeholder-val="{{ false }}"><span style="display:flex;color:var(--uiux-color-primary)"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 7-7 7 7M12 19V5"></path></svg></span></sc-if><sc-if value="{{ h.sDesc }}" hint-placeholder-val="{{ false }}"><span style="display:flex;color:var(--uiux-color-primary)"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M19 12l-7 7-7-7"></path></svg></span></sc-if></span></th></sc-for></tr></thead>
<tbody onKeyDown="{{ cm.onKey }}"><sc-for list="{{ cm.rows }}" as="row" hint-placeholder-count="8"><tr style="background:{{ row.bg }}"><sc-for list="{{ row.cells }}" as="c" hint-placeholder-count="6"><td role="gridcell" tabindex="{{ c.ti }}" aria-haspopup="menu" data-cm="{{ c.id }}" onContextMenu="{{ c.onMenu }}" onClick="{{ c.onClick }}" style="padding:10px 12px;border-bottom:1px solid var(--uiux-color-border);white-space:nowrap;text-align:{{ c.align }};font:{{ c.font }};color:{{ c.color }};box-shadow:{{ c.ring }};background:{{ c.bg }};cursor:context-menu;outline:none;user-select:none"><sc-if value="{{ c.isPill }}" hint-placeholder-val="{{ false }}"><span style="display:inline-block;padding:3px 9px;border-radius:999px;border:1px solid var(--uiux-color-border);font:600 12px var(--uiux-font-family);color:var(--uiux-color-text)">{{ c.v }}</span></sc-if><sc-if value="{{ c.plain }}" hint-placeholder-val="{{ true }}">{{ c.v }}</sc-if></td></sc-for></tr></sc-for></tbody></table>
<sc-if value="{{ cm.empty }}" hint-placeholder-val="{{ false }}"><div style="padding:36px 16px;text-align:center;font:600 15px var(--uiux-font-family)">Ninguna fila coincide</div></sc-if></div>
<div style="padding:10px 14px;display:flex;align-items:center;gap:10px;border-top:1px solid var(--uiux-color-border);background:var(--uiux-color-surface-secondary);border-radius:0 0 var(--uiux-radius-lg) var(--uiux-radius-lg)"><span style="flex:1;font:500 13px var(--uiux-font-family);color:{{ cm.msgColor }}">{{ cm.msg }}</span><span style="font:500 11.5px var(--uiux-font-mono);color:var(--uiux-color-text-muted)">{{ cm.cellRef }}</span></div>
<sc-if value="{{ cm.menuOpen }}" hint-placeholder-val="{{ false }}"><div onMouseDown="{{ cm.close }}" onContextMenu="{{ cm.closeCtx }}" style="position:fixed;inset:0;z-index:35"></div>
<div role="menu" aria-label="Acciones de celda" onKeyDown="{{ cm.menuKey }}" style="position:absolute;left:{{ cm.mx }};top:{{ cm.my }};z-index:40;width:250px;padding:6px;background:var(--uiux-color-surface);border:1px solid var(--uiux-color-border);border-radius:var(--uiux-radius-md);box-shadow:var(--uiux-shadow-lg);display:flex;flex-direction:column;gap:1px">
<div style="padding:6px 10px 8px;border-bottom:1px solid var(--uiux-color-border);margin-bottom:4px;display:flex;flex-direction:column;gap:2px"><span style="font:700 10px var(--uiux-font-family);letter-spacing:calc(0.12em * var(--uiux-label-track));text-transform:var(--uiux-label-case);color:var(--uiux-color-text-muted)">{{ cm.menuCol }}</span><span style="font:600 13px var(--uiux-font-family);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{ cm.menuVal }}</span></div>
<sc-for list="{{ cm.items }}" as="it" hint-placeholder-count="8"><sc-if value="{{ it.sep }}" hint-placeholder-val="{{ false }}"><div role="separator" style="height:1px;background:var(--uiux-color-border);margin:4px 0"></div></sc-if><sc-if value="{{ it.btn }}" hint-placeholder-val="{{ true }}"><button role="menuitem" onClick="{{ it.onClick }}" data-cm-item="1" style="display:flex;align-items:center;gap:10px;padding:7px 10px;border:none;border-radius:5px;background:transparent;color:{{ it.color }};font:500 14px var(--uiux-font-family);text-align:left;cursor:pointer;outline:none" style-hover="background:var(--uiux-color-surface-secondary)" style-focus="background:var(--uiux-color-surface-secondary)"><span style="flex:1">{{ it.label }}</span><span style="font:500 11px var(--uiux-font-mono);color:var(--uiux-color-text-muted)">{{ it.kbd }}</span></button></sc-if></sc-for>
</div></sc-if>
</div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{}">
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
