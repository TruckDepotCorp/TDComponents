<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>

<div style="display:flex;flex-direction:column;gap:14px"><div style="background:var(--uiux-color-surface);border:1px solid var(--uiux-color-border);border-radius:var(--uiux-radius-lg);box-shadow:var(--uiux-shadow-sm);overflow:hidden">
<div style="overflow-x:auto"><table style="width:{{ coltemplate.tableW }};min-width:{{ coltemplate.minW }};table-layout:{{ coltemplate.layout }};border-collapse:separate;border-spacing:0;font-size:14px;text-align:left">
<thead>
<sc-if value="{{ coltemplate.hasGroups }}" hint-placeholder-val="{{ false }}"><tr><sc-for list="{{ coltemplate.groups }}" as="g" hint-placeholder-count="3"><th colSpan="{{ g.span }}" style="padding:0 12px;height:40px;background:var(--uiux-color-surface-secondary);border-bottom:1px solid var(--uiux-color-border);font:700 11px var(--uiux-font-family);letter-spacing:calc(0.12em * var(--uiux-label-track));text-transform:var(--uiux-label-case);color:var(--uiux-color-text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center;height:34px;color:{{ g.fg }};border-left:{{ g.bl }};border-bottom:{{ g.bb }}">{{ g.label }}</th></sc-for></tr></sc-if>
<tr><sc-for list="{{ coltemplate.heads }}" as="h" hint-placeholder-count="6"><th draggable="{{ h.draggable }}" tabindex="{{ h.ti }}" aria-label="{{ h.aria }}" onDragStart="{{ h.onDragStart }}" onDragOver="{{ h.onDragOver }}" onDrop="{{ h.onDrop }}" onDragEnd="{{ h.onDragEnd }}" onKeyDown="{{ h.onKey }}" style="padding:0 12px;height:40px;background:var(--uiux-color-surface-secondary);border-bottom:1px solid var(--uiux-color-border);font:700 11px var(--uiux-font-family);letter-spacing:calc(0.12em * var(--uiux-label-track));text-transform:var(--uiux-label-case);color:var(--uiux-color-text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;position:{{ h.pos }};left:{{ h.left }};right:{{ h.right }};z-index:{{ h.z }};box-shadow:{{ h.shadow }};width:{{ h.w }};text-align:{{ h.align }};opacity:{{ h.op }};cursor:{{ h.cursor }};border-left:{{ h.bl }};outline:none" style-focus="outline:none;box-shadow:0 0 0 3px var(--uiux-color-focus-ring)">
<span style="display:inline-flex;align-items:center;gap:6px"><sc-if value="{{ h.draggable }}" hint-placeholder-val="{{ false }}"><span style="display:flex;color:var(--uiux-color-border-strong)"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="6" r="1"></circle><circle cx="9" cy="12" r="1"></circle><circle cx="9" cy="18" r="1"></circle><circle cx="15" cy="6" r="1"></circle><circle cx="15" cy="12" r="1"></circle><circle cx="15" cy="18" r="1"></circle></svg></span></sc-if>{{ h.label }}</span>
<sc-if value="{{ h.resizable }}" hint-placeholder-val="{{ false }}"><span role="separator" aria-orientation="vertical" aria-label="Redimensionar {{ h.label }}" aria-valuenow="{{ h.px }}" tabindex="0" onMouseDown="{{ h.onResize }}" onDoubleClick="{{ h.onResetW }}" onKeyDown="{{ h.onResizeKey }}" style="position:absolute;top:0;right:0;bottom:0;width:9px;cursor:col-resize;display:flex;justify-content:center;outline:none" style-hover="background:color-mix(in srgb, var(--uiux-color-primary) 18%, transparent)" style-focus="background:color-mix(in srgb, var(--uiux-color-primary) 25%, transparent)"><span style="width:2px;height:100%;background:{{ h.handleBg }}"></span></span></sc-if>
</th></sc-for></tr>
</thead>
<tbody><sc-for list="{{ coltemplate.rows }}" as="row" hint-placeholder-count="6"><tr><sc-for list="{{ row.cells }}" as="c" hint-placeholder-count="6"><td style="padding:{{ c.pad }};border-bottom:1px solid var(--uiux-color-border);position:{{ c.pos }};left:{{ c.left }};right:{{ c.right }};z-index:{{ c.z }};box-shadow:{{ c.shadow }};background:{{ c.bg }};text-align:{{ c.align }};white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-left:{{ c.bl }}">
<sc-if value="{{ c.isMono }}" hint-placeholder-val="{{ false }}"><span style="font:500 12.5px var(--uiux-font-mono);color:var(--uiux-color-text-muted)">{{ c.v }}</span></sc-if>
<sc-if value="{{ c.isStrong }}" hint-placeholder-val="{{ false }}"><span style="font-weight:600">{{ c.v }}</span></sc-if>
<sc-if value="{{ c.isText }}" hint-placeholder-val="{{ false }}"><span style="color:var(--uiux-color-text-muted)">{{ c.v }}</span></sc-if>
<sc-if value="{{ c.isPill }}" hint-placeholder-val="{{ false }}"><span style="display:inline-block;padding:3px 9px;border-radius:999px;border:1px solid var(--uiux-color-border);font:600 12px var(--uiux-font-family)">{{ c.v }}</span></sc-if>
<sc-if value="{{ c.isNum }}" hint-placeholder-val="{{ false }}"><span style="font:500 13.5px var(--uiux-font-mono);font-variant-numeric:tabular-nums;color:{{ c.color }}">{{ c.v }}</span></sc-if>
<sc-if value="{{ c.isMoney }}" hint-placeholder-val="{{ false }}"><span style="font:var(--uiux-display-style) var(--uiux-display-weight, 800) 16px var(--uiux-font-display);font-variant-numeric:tabular-nums">{{ c.v }}</span></sc-if>
<sc-if value="{{ c.isPct }}" hint-placeholder-val="{{ false }}"><span style="font:600 13px var(--uiux-font-mono);color:{{ c.color }}">{{ c.v }}</span></sc-if>
<sc-if value="{{ c.isDate }}" hint-placeholder-val="{{ false }}"><span style="font:500 12.5px var(--uiux-font-mono);color:var(--uiux-color-text-muted)">{{ c.v }}</span></sc-if>
<sc-if value="{{ c.isStatus }}" hint-placeholder-val="{{ false }}"><span style="display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:999px;background:color-mix(in srgb, {{ c.color }} 12%, transparent);color:{{ c.color }};font:700 12px var(--uiux-font-family)"><span style="width:7px;height:7px;border-radius:50%;background:{{ c.color }}"></span>{{ c.v }}</span></sc-if>
<sc-if value="{{ c.isBar }}" hint-placeholder-val="{{ false }}"><div style="display:flex;align-items:center;gap:10px"><div style="flex:1;min-width:60px;height:6px;border-radius:999px;background:var(--uiux-color-surface-secondary);border:1px solid var(--uiux-color-border);overflow:hidden"><div style="height:100%;width:{{ c.pct }};background:{{ c.color }}"></div></div><span style="width:30px;text-align:right;font:500 12.5px var(--uiux-font-mono)">{{ c.v }}</span></div></sc-if>
<sc-if value="{{ c.isPart }}" hint-placeholder-val="{{ false }}"><div style="display:flex;align-items:center;gap:10px"><span style="width:36px;height:36px;flex:none;border-radius:var(--uiux-radius-sm);background:var(--uiux-color-surface-secondary);border:1px solid var(--uiux-color-border);display:flex;align-items:center;justify-content:center;font:700 10px var(--uiux-font-mono);color:var(--uiux-color-text-muted)">{{ c.abbr }}</span><div style="display:flex;flex-direction:column;gap:2px;min-width:0"><span style="font-weight:600;overflow:hidden;text-overflow:ellipsis">{{ c.v }}</span><span style="font:500 11.5px var(--uiux-font-mono);color:var(--uiux-color-text-muted)">{{ c.code }}</span></div></div></sc-if>
<sc-if value="{{ c.isActions }}" hint-placeholder-val="{{ false }}"><div style="display:flex;gap:6px;justify-content:flex-end"><button onClick="{{ c.onQuote }}" style="height:30px;padding:0 10px;border-radius:var(--uiux-radius-sm);border:1px solid var(--uiux-color-border-strong);background:transparent;color:var(--uiux-color-text);font:700 11px var(--uiux-font-family);letter-spacing:calc(0.08em * var(--uiux-label-track));text-transform:var(--uiux-label-case);cursor:pointer" style-hover="background:var(--uiux-color-surface-secondary)" style-focus="outline:none;box-shadow:0 0 0 3px var(--uiux-color-focus-ring)">Cotizar</button><button onClick="{{ c.onCart }}" aria-label="Agregar {{ c.code }} al carrito" style="width:30px;height:30px;border-radius:var(--uiux-radius-sm);border:none;background:var(--uiux-color-primary);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center" style-hover="background:var(--uiux-color-primary-hover)" style-focus="outline:none;box-shadow:0 0 0 3px var(--uiux-color-focus-ring)"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="21" r="1"></circle><circle cx="19" cy="21" r="1"></circle><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"></path></svg></button></div></sc-if>
</td></sc-for></tr></sc-for></tbody>
<sc-if value="{{ coltemplate.hasFooter }}" hint-placeholder-val="{{ false }}"><tfoot><tr><sc-for list="{{ coltemplate.foot }}" as="ft" hint-placeholder-count="6"><td style="padding:11px 12px;background:var(--uiux-color-surface-secondary);border-top:2px solid var(--uiux-color-border-strong);position:{{ ft.pos }};left:{{ ft.left }};right:{{ ft.right }};z-index:{{ ft.z }};box-shadow:{{ ft.shadow }};text-align:{{ ft.align }};white-space:nowrap"><span style="display:flex;flex-direction:column;gap:1px;align-items:{{ ft.items }}"><span style="font:700 10px var(--uiux-font-family);letter-spacing:calc(0.12em * var(--uiux-label-track));text-transform:var(--uiux-label-case);color:var(--uiux-color-text-muted)">{{ ft.label }}</span><span style="font:{{ ft.font }}">{{ ft.v }}</span></span></td></sc-for></tr></tfoot></sc-if>
</table></div>
<sc-if value="{{ coltemplate.hasMsg }}" hint-placeholder-val="{{ false }}"><div style="padding:10px 14px;border-top:1px solid var(--uiux-color-border);background:var(--uiux-color-surface-secondary);font:500 13px var(--uiux-font-family);color:var(--uiux-color-success)">{{ coltemplate.msg }}</div></sc-if>
</div></div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{}">
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
