<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>

<div style="background:var(--uiux-color-surface);border:1px solid var(--uiux-color-border);border-radius:var(--uiux-radius-lg);box-shadow:var(--uiux-shadow-sm);padding:22px;display:flex;flex-direction:column;gap:20px"><div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:24px 20px;align-items:start"><sc-for list="{{ dd.trees }}" as="d" hint-placeholder-count="3"><div style="display:flex;flex-direction:column;gap:6px;min-width:0"><span style="font:700 11px var(--uiux-font-family);letter-spacing:calc(0.14em * var(--uiux-label-track));text-transform:var(--uiux-label-case);color:var(--uiux-color-text-muted)">{{ d.title }}</span><div style="position:relative"><div role="combobox" tabindex="0" aria-haspopup="{{ d.popup }}" aria-expanded="{{ d.openS }}" data-dd-trigger="{{ d.key }}" onClick="{{ d.onToggle }}" onKeyDown="{{ d.onKey }}" style="min-height:40px;box-sizing:border-box;padding:5px 64px 5px 6px;display:flex;flex-wrap:wrap;gap:4px;align-items:center;border:1px solid {{ d.border }};border-radius:var(--uiux-radius-md);background:var(--uiux-color-surface);box-shadow:{{ d.ring }};cursor:pointer;outline:none;position:relative;transition:border-color 120ms" style-focus="border-color:var(--uiux-color-primary);box-shadow:0 0 0 3px var(--uiux-color-focus-ring)">
<sc-if value="{{ d.empty }}" hint-placeholder-val="{{ true }}"><span style="padding-left:6px;font:500 14px var(--uiux-font-family);color:var(--uiux-color-text-muted)">{{ d.ph }}</span></sc-if>
<sc-if value="{{ d.summary }}" hint-placeholder-val="{{ false }}"><span style="padding-left:6px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font:500 14px var(--uiux-font-family);color:var(--uiux-color-text)">{{ d.sumText }}</span></sc-if>
<sc-for list="{{ d.chips }}" as="c" hint-placeholder-count="0"><span style="display:inline-flex;align-items:center;gap:2px;height:28px;box-sizing:border-box;padding:0 2px 0 10px;border-radius:999px;background:color-mix(in srgb, var(--uiux-color-primary) 10%, transparent);border:1px solid color-mix(in srgb, var(--uiux-color-primary) 35%, transparent);font:600 12.5px var(--uiux-font-family);color:var(--uiux-color-text);white-space:nowrap">{{ c.label }}<button type="button" tabindex="-1" onClick="{{ c.onRemove }}" aria-label="Quitar {{ c.label }}" style="width:22px;height:22px;border:none;border-radius:50%;background:transparent;color:var(--uiux-color-text-muted);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0" style-hover="background:var(--uiux-color-border);color:var(--uiux-color-text)"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"></path></svg></button></span></sc-for>
<sc-if value="{{ d.hasMore }}" hint-placeholder-val="{{ false }}"><span style="height:28px;box-sizing:border-box;padding:0 10px;border-radius:999px;background:var(--uiux-color-surface-secondary);border:1px solid var(--uiux-color-border);font:700 12px var(--uiux-font-mono);display:inline-flex;align-items:center">{{ d.more }}</span></sc-if>
<span style="position:absolute;right:10px;top:50%;margin-top:-8px;display:flex;color:var(--uiux-color-text-muted);transform:{{ d.rot }};transition:transform 150ms"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"></path></svg></span></div><sc-if value="{{ d.hasClear }}" hint-placeholder-val="{{ false }}"><button type="button" onClick="{{ d.onClear }}" aria-label="Borrar selección" title="Borrar" style="position:absolute;right:34px;top:6px;width:28px;height:28px;border:none;border-radius:50%;background:transparent;color:var(--uiux-color-text-muted);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0" style-hover="background:var(--uiux-color-surface-secondary);color:var(--uiux-color-text)" style-focus="outline:none;box-shadow:0 0 0 3px var(--uiux-color-focus-ring)"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"></path></svg></button></sc-if>
<sc-if value="{{ d.open }}" hint-placeholder-val="{{ false }}"><div onMouseDown="{{ d.onClose }}" style="position:fixed;inset:0;z-index:25"></div><div style="position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:30;min-width:250px;background:var(--uiux-color-surface);border:1px solid var(--uiux-color-border);border-radius:var(--uiux-radius-md);box-shadow:var(--uiux-shadow-lg);overflow:hidden"><div style="padding:8px;border-bottom:1px solid var(--uiux-color-border);display:flex"><div style="position:relative;flex:1;min-width:0"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="position:absolute;left:10px;top:11px;color:var(--uiux-color-text-muted)"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path></svg><input autoFocus="{{ true }}" value="{{ d.q }}" onChange="{{ d.setQ }}" onKeyDown="{{ d.onKey }}" placeholder="Buscar categoría o componente…" aria-label="Buscar" style="height:40px;box-sizing:border-box;width:100%;padding:0 12px;border-radius:var(--uiux-radius-md);border:1px solid var(--uiux-color-border-strong);background:var(--uiux-color-surface);color:var(--uiux-color-text);font:500 14px var(--uiux-font-family);outline:none;height:36px;padding-left:30px" style-focus="border-color:var(--uiux-color-primary);box-shadow:0 0 0 3px var(--uiux-color-focus-ring)"></div></div>
<div role="tree" data-dd-list="{{ d.key }}" style="max-height:290px;overflow-y:auto;overflow-x:hidden;padding:4px;position:relative;display:flex;flex-direction:column"><sc-for list="{{ d.items }}" as="n" hint-placeholder-count="0"><div role="treeitem" aria-expanded="{{ n.ariaExp }}" aria-selected="{{ n.aria }}" data-hi="{{ n.hiS }}" onMouseDown="{{ n.onPick }}" onMouseEnter="{{ n.onHover }}" style="display:flex;align-items:center;gap:6px;height:34px;flex:none;box-sizing:border-box;padding:0 10px 0 {{ n.pad }};border-radius:5px;background:{{ n.bg }};box-shadow:{{ n.bar }};cursor:pointer"><span onMouseDown="{{ n.onExp }}" aria-hidden="true" style="width:22px;height:22px;flex:none;border-radius:4px;display:flex;align-items:center;justify-content:center;color:var(--uiux-color-text-muted);opacity:{{ n.caretOp }};transform:{{ n.rot }};transition:transform 120ms" style-hover="background:var(--uiux-color-border)"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"></path></svg></span><sc-if value="{{ n.multi }}" hint-placeholder-val="{{ false }}"><span style="width:16px;height:16px;box-sizing:border-box;border-radius:3px;border:1.5px solid {{ n.boxBorder }};background:{{ n.boxBg }};display:flex;align-items:center;justify-content:center;color:#fff;flex:none;position:relative"><span style="display:flex;opacity:{{ n.op }}"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"></path></svg></span><span style="display:flex;position:absolute;opacity:{{ n.mop }}"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"></path></svg></span></span></sc-if><span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font:{{ n.font }};color:{{ n.color }}">{{ n.label }}</span><span style="font:500 11px var(--uiux-font-mono);color:var(--uiux-color-text-muted)">{{ n.sub }}</span></div></sc-for><sc-if value="{{ d.none }}" hint-placeholder-val="{{ false }}"><div style="padding:14px 10px;font-size:13.5px;color:var(--uiux-color-text-muted)">Sin resultados</div></sc-if></div>
<div style="padding:7px 12px;border-top:1px solid var(--uiux-color-border);background:var(--uiux-color-surface-secondary);font:500 11.5px var(--uiux-font-mono);color:var(--uiux-color-text-muted)">↑ ↓ navegar · → expandir · ← contraer · Enter elegir</div></div></sc-if></div><span style="font:500 12.5px var(--uiux-font-family);color:var(--uiux-color-text-muted)">{{ d.hint }}</span><span style="font:500 11.5px var(--uiux-font-mono);color:var(--uiux-color-text-muted)">{{ d.val }}</span></div></sc-for></div></div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{}">
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
