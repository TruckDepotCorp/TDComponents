<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>

<div style="display:flex;flex-direction:column;gap:14px">
<div style="display:flex;gap:14px;flex-wrap:wrap;align-items:flex-start;padding:16px;background:var(--uiux-color-surface);border:1px solid var(--uiux-color-border);border-radius:var(--uiux-radius-lg)"><div style="display:flex;flex-direction:column;gap:6px;flex:1 1 180px"><label style="font:600 13px var(--uiux-font-family);color:{{ cs.brand.labelColor }}">1 · Marca</label><select value="{{ cs.brand.value }}" onChange="{{ cs.brand.onChange }}" disabled="{{ cs.brand.disabled }}" aria-label="1 · Marca" style="height:32px;box-sizing:border-box;width:100%;padding:0 6px;border-radius:var(--uiux-radius-sm);background:var(--uiux-color-surface);color:var(--uiux-color-text);font:500 13.5px var(--uiux-font-family);outline:none;height:40px;border:1px solid {{ cs.brand.border }};opacity:{{ cs.brand.op }};cursor:{{ cs.brand.cursor }}"><option value="">{{ cs.brand.ph }}</option><sc-for list="{{ cs.brand.opts }}" as="o" hint-placeholder-count="5"><option value="{{ o.v }}">{{ o.l }}</option></sc-for></select><span style="font-size:12px;color:var(--uiux-color-text-muted)">{{ cs.brand.hint }}</span></div><div style="display:flex;flex-direction:column;gap:6px;flex:1 1 180px"><label style="font:600 13px var(--uiux-font-family);color:{{ cs.model.labelColor }}">2 · Modelo</label><select value="{{ cs.model.value }}" onChange="{{ cs.model.onChange }}" disabled="{{ cs.model.disabled }}" aria-label="2 · Modelo" style="height:32px;box-sizing:border-box;width:100%;padding:0 6px;border-radius:var(--uiux-radius-sm);background:var(--uiux-color-surface);color:var(--uiux-color-text);font:500 13.5px var(--uiux-font-family);outline:none;height:40px;border:1px solid {{ cs.model.border }};opacity:{{ cs.model.op }};cursor:{{ cs.model.cursor }}"><option value="">{{ cs.model.ph }}</option><sc-for list="{{ cs.model.opts }}" as="o" hint-placeholder-count="5"><option value="{{ o.v }}">{{ o.l }}</option></sc-for></select><span style="font-size:12px;color:var(--uiux-color-text-muted)">{{ cs.model.hint }}</span></div><div style="display:flex;flex-direction:column;gap:6px;flex:1 1 180px"><label style="font:600 13px var(--uiux-font-family);color:{{ cs.cat.labelColor }}">3 · Sistema</label><select value="{{ cs.cat.value }}" onChange="{{ cs.cat.onChange }}" disabled="{{ cs.cat.disabled }}" aria-label="3 · Sistema" style="height:32px;box-sizing:border-box;width:100%;padding:0 6px;border-radius:var(--uiux-radius-sm);background:var(--uiux-color-surface);color:var(--uiux-color-text);font:500 13.5px var(--uiux-font-family);outline:none;height:40px;border:1px solid {{ cs.cat.border }};opacity:{{ cs.cat.op }};cursor:{{ cs.cat.cursor }}"><option value="">{{ cs.cat.ph }}</option><sc-for list="{{ cs.cat.opts }}" as="o" hint-placeholder-count="5"><option value="{{ o.v }}">{{ o.l }}</option></sc-for></select><span style="font-size:12px;color:var(--uiux-color-text-muted)">{{ cs.cat.hint }}</span></div><button onClick="{{ cs.reset }}" style="margin-top:25px;height:40px;padding:0 12px;border-radius:var(--uiux-radius-sm);border:1px solid var(--uiux-color-border-strong);background:transparent;color:var(--uiux-color-text);font:700 12px var(--uiux-font-family);letter-spacing:calc(0.08em * var(--uiux-label-track));text-transform:var(--uiux-label-case);cursor:pointer" style-focus="outline:none;box-shadow:0 0 0 3px var(--uiux-color-focus-ring)">Reiniciar</button></div>
<div style="background:var(--uiux-color-surface);border:1px solid var(--uiux-color-border);border-radius:var(--uiux-radius-lg);box-shadow:var(--uiux-shadow-sm);overflow:hidden"><div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:14px;text-align:left"><thead><tr><th style="padding:0 12px;height:40px;background:var(--uiux-color-surface-secondary);border-bottom:1px solid var(--uiux-color-border);font:700 11px var(--uiux-font-family);letter-spacing:calc(0.12em * var(--uiux-label-track));text-transform:var(--uiux-label-case);color:var(--uiux-color-text-muted);white-space:nowrap">Código</th><th style="padding:0 12px;height:40px;background:var(--uiux-color-surface-secondary);border-bottom:1px solid var(--uiux-color-border);font:700 11px var(--uiux-font-family);letter-spacing:calc(0.12em * var(--uiux-label-track));text-transform:var(--uiux-label-case);color:var(--uiux-color-text-muted);white-space:nowrap">Repuesto</th><th style="padding:0 12px;height:40px;background:var(--uiux-color-surface-secondary);border-bottom:1px solid var(--uiux-color-border);font:700 11px var(--uiux-font-family);letter-spacing:calc(0.12em * var(--uiux-label-track));text-transform:var(--uiux-label-case);color:var(--uiux-color-text-muted);white-space:nowrap">Aplicación</th><th style="padding:0 12px;height:40px;background:var(--uiux-color-surface-secondary);border-bottom:1px solid var(--uiux-color-border);font:700 11px var(--uiux-font-family);letter-spacing:calc(0.12em * var(--uiux-label-track));text-transform:var(--uiux-label-case);color:var(--uiux-color-text-muted);white-space:nowrap">Sistema</th><th style="padding:0 12px;height:40px;background:var(--uiux-color-surface-secondary);border-bottom:1px solid var(--uiux-color-border);font:700 11px var(--uiux-font-family);letter-spacing:calc(0.12em * var(--uiux-label-track));text-transform:var(--uiux-label-case);color:var(--uiux-color-text-muted);white-space:nowrap;text-align:right">Stock</th><th style="padding:0 12px;height:40px;background:var(--uiux-color-surface-secondary);border-bottom:1px solid var(--uiux-color-border);font:700 11px var(--uiux-font-family);letter-spacing:calc(0.12em * var(--uiux-label-track));text-transform:var(--uiux-label-case);color:var(--uiux-color-text-muted);white-space:nowrap;text-align:right">Precio</th></tr></thead>
<tbody><sc-for list="{{ cs.rows }}" as="row" hint-placeholder-count="5"><tr><td style="padding:8px 12px;border-bottom:1px solid var(--uiux-color-border);white-space:nowrap;vertical-align:top;padding:10px 12px;font:500 12.5px var(--uiux-font-mono);color:var(--uiux-color-text-muted)">{{ row.code }}</td><td style="padding:8px 12px;border-bottom:1px solid var(--uiux-color-border);white-space:nowrap;vertical-align:top;padding:10px 12px;font-weight:600">{{ row.name }}</td><td style="padding:8px 12px;border-bottom:1px solid var(--uiux-color-border);white-space:nowrap;vertical-align:top;padding:10px 12px;color:var(--uiux-color-text-muted)">{{ row.app }}</td><td style="padding:8px 12px;border-bottom:1px solid var(--uiux-color-border);white-space:nowrap;vertical-align:top;padding:10px 12px"><span style="display:inline-block;padding:3px 9px;border-radius:999px;border:1px solid var(--uiux-color-border);font:600 12px var(--uiux-font-family)">{{ row.cat }}</span></td><td style="padding:8px 12px;border-bottom:1px solid var(--uiux-color-border);white-space:nowrap;vertical-align:top;padding:10px 12px;text-align:right;font:500 13.5px var(--uiux-font-mono);color:{{ row.stColor }}">{{ row.stock }}</td><td style="padding:8px 12px;border-bottom:1px solid var(--uiux-color-border);white-space:nowrap;vertical-align:top;padding:10px 12px;text-align:right;font:var(--uiux-display-style) var(--uiux-display-weight, 800) 16px var(--uiux-font-display)">{{ row.price }}</td></tr></sc-for></tbody></table>
<sc-if value="{{ cs.empty }}" hint-placeholder-val="{{ false }}"><div style="padding:32px 16px;text-align:center;font:600 14px var(--uiux-font-family);color:var(--uiux-color-text-muted)">Sin repuestos para esta combinación</div></sc-if></div><div style="padding:10px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;border-top:1px solid var(--uiux-color-border);background:var(--uiux-color-surface-secondary)"><span style="flex:1;min-width:200px;font:500 13px var(--uiux-font-family);color:{{ cs.msgColor }}">{{ cs.msg }}</span></div></div></div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{}">
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
