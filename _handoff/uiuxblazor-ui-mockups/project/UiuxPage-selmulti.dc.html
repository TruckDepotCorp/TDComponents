<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>

<div style="display:flex;flex-direction:column;gap:14px"><div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap"><span style="font-size:13px;color:var(--uiux-color-text-muted)">Clic alterna la fila; Shift + clic selecciona un rango. Espacio alterna con el teclado.</span><div style="flex:1"></div><button role="switch" aria-checked="{{ selmulti.toggleOnly.aria }}" onClick="{{ selmulti.toggleOnly.onToggle }}" style="display:flex;align-items:center;gap:10px;padding:0;border:none;background:transparent;color:var(--uiux-color-text);font:500 14px var(--uiux-font-family);cursor:pointer;border-radius:5px" style-focus="outline:none;box-shadow:0 0 0 3px var(--uiux-color-focus-ring)"><span style="width:36px;height:20px;border-radius:999px;background:{{ selmulti.toggleOnly.bg }};position:relative;flex:none"><span style="position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:#fff;transform:{{ selmulti.toggleOnly.tf }};transition:transform 120ms"></span></span>{{ selmulti.toggleOnly.label }}</button></div><sc-if value="{{ selmulti.hasSel }}" hint-placeholder-val="{{ false }}"><div role="toolbar" aria-label="Acciones en lote" style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 14px;background:var(--uiux-color-text);color:var(--uiux-color-surface);border-radius:var(--uiux-radius-md)"><span style="font:600 14px var(--uiux-font-family);flex:1">{{ selmulti.bulkLabel }}</span><sc-for list="{{ selmulti.actions }}" as="ba" hint-placeholder-count="3"><button onClick="{{ ba.onClick }}" style="height:32px;padding:0 12px;border-radius:var(--uiux-radius-sm);border:1px solid color-mix(in srgb, var(--uiux-color-surface) 35%, transparent);background:transparent;color:var(--uiux-color-surface);font:700 11px var(--uiux-font-family);letter-spacing:calc(0.08em * var(--uiux-label-track));text-transform:var(--uiux-label-case);cursor:pointer" style-hover="background:color-mix(in srgb, var(--uiux-color-surface) 12%, transparent)">{{ ba.label }}</button></sc-for></div></sc-if><div style="background:var(--uiux-color-surface);border:1px solid var(--uiux-color-border);border-radius:var(--uiux-radius-lg);box-shadow:var(--uiux-shadow-sm);overflow:hidden">
<div style="overflow-x:auto"><table role="grid" aria-multiselectable="{{ selmulti.multiAria }}" style="width:100%;border-collapse:collapse;font-size:14px;text-align:left">
<thead><tr>
<sc-if value="{{ selmulti.hasBox }}" hint-placeholder-val="{{ false }}"><th style="padding:0 12px;height:40px;background:var(--uiux-color-surface-secondary);border-bottom:1px solid var(--uiux-color-border);font:700 11px var(--uiux-font-family);letter-spacing:calc(0.12em * var(--uiux-label-track));text-transform:var(--uiux-label-case);color:var(--uiux-color-text-muted);white-space:nowrap;width:44px;padding:0 0 0 14px"><button role="checkbox" aria-checked="{{ selmulti.all.aria }}" aria-label="Seleccionar todo" onClick="{{ selmulti.all.onToggle }}" style="padding:0;border:none;background:transparent;cursor:pointer;display:flex" style-focus="outline:none;box-shadow:0 0 0 3px var(--uiux-color-focus-ring)"><span style="width:16px;height:16px;border-radius:3px;border:1.5px solid {{ selmulti.all.boxBorder }};background:{{ selmulti.all.boxBg }};display:flex;align-items:center;justify-content:center;color:#fff"><sc-if value="{{ selmulti.all.on }}" hint-placeholder-val="{{ false }}"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"></path></svg></sc-if><sc-if value="{{ selmulti.all.some }}" hint-placeholder-val="{{ false }}"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"></path></svg></sc-if></span></button></th></sc-if>
<sc-if value="{{ selmulti.hasRadio }}" hint-placeholder-val="{{ false }}"><th style="padding:0 12px;height:40px;background:var(--uiux-color-surface-secondary);border-bottom:1px solid var(--uiux-color-border);font:700 11px var(--uiux-font-family);letter-spacing:calc(0.12em * var(--uiux-label-track));text-transform:var(--uiux-label-case);color:var(--uiux-color-text-muted);white-space:nowrap;width:44px;padding:0 0 0 14px"><span style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Seleccionar</span></th></sc-if>
<sc-for list="{{ selmulti.heads }}" as="h" hint-placeholder-count="6"><th aria-sort="{{ h.ariaSort }}" style="padding:0 12px;height:40px;background:var(--uiux-color-surface-secondary);border-bottom:1px solid var(--uiux-color-border);font:700 11px var(--uiux-font-family);letter-spacing:calc(0.12em * var(--uiux-label-track));text-transform:var(--uiux-label-case);color:var(--uiux-color-text-muted);white-space:nowrap;text-align:{{ h.align }}">
<sc-if value="{{ h.sortable }}" hint-placeholder-val="{{ true }}"><button onClick="{{ h.onSort }}" title="{{ h.title }}" style="display:inline-flex;align-items:center;gap:6px;padding:4px 0;border:none;background:transparent;color:{{ h.labelColor }};font:700 11px var(--uiux-font-family);letter-spacing:calc(0.12em * var(--uiux-label-track));text-transform:var(--uiux-label-case);cursor:pointer;white-space:nowrap" style-hover="color:var(--uiux-color-text)" style-focus="outline:none;box-shadow:0 0 0 3px var(--uiux-color-focus-ring)">{{ h.label }}<span style="display:flex;color:{{ h.sortColor }};opacity:{{ h.sortOp }}"><sc-if value="{{ h.sAsc }}" hint-placeholder-val="{{ false }}"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 7-7 7 7M12 19V5"></path></svg></sc-if><sc-if value="{{ h.sDesc }}" hint-placeholder-val="{{ false }}"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M19 12l-7 7-7-7"></path></svg></sc-if><sc-if value="{{ h.sNone }}" hint-placeholder-val="{{ true }}"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21 16-4 4-4-4M17 20V4M3 8l4-4 4 4M7 4v16"></path></svg></sc-if></span><sc-if value="{{ h.hasRank }}" hint-placeholder-val="{{ false }}"><span style="min-width:16px;height:16px;padding:0 4px;box-sizing:border-box;border-radius:999px;background:var(--uiux-color-primary);color:#fff;font:700 10px var(--uiux-font-mono);display:flex;align-items:center;justify-content:center">{{ h.rank }}</span></sc-if></button></sc-if>
<sc-if value="{{ h.plain }}" hint-placeholder-val="{{ false }}"><span>{{ h.label }}</span></sc-if>
</th></sc-for></tr></thead>
<tbody onKeyDown="{{ selmulti.onKey }}"><sc-for list="{{ selmulti.rows }}" as="row" hint-placeholder-count="6"><tr aria-selected="{{ row.aria }}" tabindex="{{ row.ti }}" onClick="{{ row.onClick }}" onFocus="{{ row.onFocus }}" style="background:{{ row.bg }};box-shadow:{{ row.bar }};cursor:{{ row.cursor }};outline:none;transition:background 120ms" style-hover="background:color-mix(in srgb, var(--uiux-color-primary) 5%, var(--uiux-color-surface))" style-focus="box-shadow:inset 0 0 0 2px var(--uiux-color-primary)">
<sc-if value="{{ selmulti.hasBox }}" hint-placeholder-val="{{ false }}"><td style="padding:10px 0 10px 14px;border-bottom:1px solid var(--uiux-color-border)"><span role="checkbox" aria-checked="{{ row.aria }}" style="width:16px;height:16px;border-radius:3px;border:1.5px solid {{ row.boxBorder }};background:{{ row.boxBg }};display:flex;align-items:center;justify-content:center;color:#fff"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" style="opacity:{{ row.op }}"><path d="M20 6 9 17l-5-5"></path></svg></span></td></sc-if>
<sc-if value="{{ selmulti.hasRadio }}" hint-placeholder-val="{{ false }}"><td style="padding:10px 0 10px 14px;border-bottom:1px solid var(--uiux-color-border)"><span role="radio" aria-checked="{{ row.aria }}" style="width:16px;height:16px;box-sizing:border-box;border-radius:50%;border:1.5px solid {{ row.boxBorder }};display:flex;align-items:center;justify-content:center"><span style="width:8px;height:8px;border-radius:50%;background:var(--uiux-color-primary);opacity:{{ row.op }}"></span></span></td></sc-if>
<sc-for list="{{ row.cells }}" as="c" hint-placeholder-count="6"><td style="padding:10px 12px;border-bottom:1px solid var(--uiux-color-border);white-space:nowrap;text-align:{{ c.align }};font:{{ c.font }};color:{{ c.color }};background:{{ c.bg }}"><sc-if value="{{ c.isPill }}" hint-placeholder-val="{{ false }}"><span style="display:inline-block;padding:3px 9px;border-radius:999px;border:1px solid var(--uiux-color-border);font:600 12px var(--uiux-font-family);color:var(--uiux-color-text)">{{ c.v }}</span></sc-if><sc-if value="{{ c.plain }}" hint-placeholder-val="{{ true }}">{{ c.v }}</sc-if></td></sc-for>
</tr></sc-for></tbody></table></div>
<div style="padding:10px 14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;border-top:1px solid var(--uiux-color-border);background:var(--uiux-color-surface-secondary)"><span style="flex:1;min-width:200px;font:500 13px var(--uiux-font-family);color:var(--uiux-color-text-muted)">{{ selmulti.status }}</span><sc-if value="{{ selmulti.hasClear }}" hint-placeholder-val="{{ false }}"><button onClick="{{ selmulti.clear }}" style="border:none;background:transparent;color:var(--uiux-color-primary);font:700 12px var(--uiux-font-family);letter-spacing:calc(0.08em * var(--uiux-label-track));text-transform:var(--uiux-label-case);cursor:pointer">{{ selmulti.clearLabel }}</button></sc-if></div>
</div></div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{}">
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
